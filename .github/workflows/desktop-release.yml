name: Build and publish Prism Hub desktop

# 发布任务使用所选 GitHub Environment。请在那里配置 OSS、更新签名等变量与密钥。
# macOS 发布还必须配置 APPLE_CERTIFICATE、APPLE_CERTIFICATE_PASSWORD、
# APPLE_SIGNING_IDENTITY、APPLE_API_KEY、APPLE_API_KEY_ID 与 APPLE_API_ISSUER，
# 以完成 Developer ID 签名、公证与票据装订。

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'desktop-app/**'
      - 'desktop-shell/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. Leave empty to use the detected Tauri config.'
        required: false
        type: string
      environment:
        description: 'Production deployment environment and OSS prefix.'
        required: true
        default: prod
        type: choice
        options:
          - prod
      publish:
        description: 'Publish installers for the selected platforms.'
        required: true
        default: false
        type: boolean
      macos_arm64:
        description: 'Build macOS Apple Silicon (arm64) installer.'
        required: true
        default: true
        type: boolean
      macos_x64:
        description: 'Build macOS Intel (x64) installer.'
        required: true
        default: false
        type: boolean
      windows_x64:
        description: 'Build Windows x64 installers (NSIS and MSI).'
        required: true
        default: true
        type: boolean
      linux_x64:
        description: 'Build Linux x64 installers (AppImage, DEB and RPM).'
        required: true
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: prism-hub-desktop-${{ github.ref }}
  # PR 的新提交无需等待旧构建完成；标签发布仍保留全部运行，避免中断制品发布。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.22.12'

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      environment: ${{ steps.release.outputs.environment }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      desktop_project: ${{ steps.release.outputs.desktop_project }}
      desktop_mode: ${{ steps.release.outputs.desktop_mode }}
      selected_platforms: ${{ steps.release.outputs.selected_platforms }}
      build_matrix: ${{ steps.release.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: release
        name: Resolve version and target environment
        shell: bash
        env:
          INPUT_MACOS_ARM64: ${{ inputs.macos_arm64 }}
          INPUT_MACOS_X64: ${{ inputs.macos_x64 }}
          INPUT_WINDOWS_X64: ${{ inputs.windows_x64 }}
          INPUT_LINUX_X64: ${{ inputs.linux_x64 }}
        run: |
          set -euo pipefail

          if [[ -f desktop-app/src-tauri/tauri.conf.json ]]; then
            desktop_project="desktop-app"
            desktop_mode="desktop-app"
          elif [[ -f desktop-shell/src-tauri/tauri.conf.json ]]; then
            desktop_project="desktop-shell"
            desktop_mode="desktop-shell"
          else
            echo 'No supported Tauri project found. Expected desktop-app/src-tauri/tauri.conf.json or desktop-shell/src-tauri/tauri.conf.json.' >&2
            find . -maxdepth 3 -name tauri.conf.json -print >&2 || true
            exit 1
          fi

          config_version="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version)" "$desktop_project/src-tauri/tauri.conf.json")"
          requested_version="${{ inputs.version }}"
          requested_environment="${{ inputs.environment }}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            environment="prod"
            should_publish=true
            if [[ "${GITHUB_REF_NAME}" == "${version}" ]]; then
              echo "Release tags must use the v<major.minor.patch> format." >&2
              exit 1
            fi
          else
            version="${requested_version:-${config_version}}"
            environment="${requested_environment:-prod}"
            should_publish="${{ inputs.publish }}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          if [[ "${version}" != "${config_version}" ]]; then
            echo "Tag/manual version (${version}) must match ${desktop_project}/src-tauri/tauri.conf.json (${config_version})." >&2
            exit 1
          fi
          if [[ "${environment}" != "prod" ]]; then
            echo "Invalid deployment environment: ${environment}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"
          echo "desktop_project=${desktop_project}" >> "$GITHUB_OUTPUT"
          echo "desktop_mode=${desktop_mode}" >> "$GITHUB_OUTPUT"

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const allPlatforms = [
            {
              input: 'INPUT_MACOS_ARM64',
              platform: 'macos-arm64',
              runner: 'macos-14',
              bundles: 'app,dmg',
              needs_wix: false,
              appimage_extract_and_run: '',
              linux_package_set: '',
              tauri_log: '',
            },
            {
              input: 'INPUT_MACOS_X64',
              platform: 'macos-x64',
              runner: 'macos-15-intel',
              bundles: 'app,dmg',
              needs_wix: false,
              appimage_extract_and_run: '',
              linux_package_set: '',
              tauri_log: '',
            },
            {
              input: 'INPUT_WINDOWS_X64',
              platform: 'windows-x64',
              runner: 'windows-2022',
              bundles: 'nsis,msi',
              needs_wix: true,
              appimage_extract_and_run: '',
              linux_package_set: '',
              tauri_log: '',
            },
            {
              input: 'INPUT_LINUX_X64',
              platform: 'linux-x64',
              runner: 'ubuntu-22.04',
              bundles: 'appimage,deb,rpm',
              needs_wix: false,
              appimage_extract_and_run: '1',
              linux_package_set: 'full',
              tauri_log: '',
            },
          ];
          const isTag = process.env.GITHUB_REF_TYPE === 'tag';
          const isPullRequest = process.env.GITHUB_EVENT_NAME === 'pull_request';
          // 标签、PR 和手动构建默认只覆盖 macOS 与 Windows；Linux 仅在手动勾选时加入。
          const include = allPlatforms.filter(({ input, platform }) =>
            (isTag || isPullRequest) ? platform !== 'linux-x64' : process.env[input] !== 'false'
          );
          if (include.length === 0) throw new Error('Select at least one desktop platform.');
          console.log(`selected_platforms=${include.map(({ platform }) => platform).join(',')}`);
          console.log(`build_matrix=${JSON.stringify({ include })}`);
          NODE

      - name: Validate desktop runtime sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.release.outputs.desktop_mode }}" == "desktop-app" ]]; then
            test -f cmd/prism/main.go || {
              echo 'Missing cmd/prism/main.go. desktop-app/scripts/prepare-sidecar.mjs builds this package into every installer.' >&2
              exit 1
            }
          else
            test -f cmd/rokid-prism-hub/main.go || {
              echo 'Missing cmd/rokid-prism-hub/main.go. desktop-shell/scripts/prepare-runtime.mjs builds this package into every installer.' >&2
              exit 1
            }
            test -f third_party/acp-go-sdk/go.mod || {
              echo 'Missing third_party/acp-go-sdk. go.mod replaces github.com/coder/acp-go-sdk with this source directory.' >&2
              exit 1
            }
          fi

  build:
    name: Build ${{ matrix.platform }} (${{ needs.prepare.outputs.environment }})
    needs: prepare
    environment: ${{ github.event_name == 'pull_request' && 'public-ci' || needs.prepare.outputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    # All public repository builds use disposable GitHub-hosted runners.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      DESKTOP_PROJECT: ${{ needs.prepare.outputs.desktop_project }}
      DESKTOP_MODE: ${{ needs.prepare.outputs.desktop_mode }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            desktop-file-utils \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            squashfs-tools
          if [[ "${{ matrix.linux_package_set }}" == "full" ]]; then
            sudo apt-get install --yes rpm
          fi

      - name: Verify Linux AppImage tooling
        if: runner.os == 'Linux' && matrix.appimage_extract_and_run != ''
        run: |
          set -euo pipefail
          command -v mksquashfs
          mksquashfs -version
          ldconfig -p | grep -F 'libfuse.so.2'

      - name: Install WiX toolset for MSI packaging
        if: runner.os == 'Windows' && matrix.needs_wix
        shell: pwsh
        run: |
          function Find-WixBin {
            $roots = @(
              'C:\Program Files (x86)\WiX Toolset v3.14\bin',
              'C:\Program Files (x86)\WiX Toolset v3.11\bin'
            )
            if ($env:WIX) { $roots += Join-Path $env:WIX 'bin' }
            if ($env:WIX_ROOT) { $roots += Join-Path $env:WIX_ROOT 'bin' }
            $roots = $roots | Where-Object { Test-Path -LiteralPath $_ }
            foreach ($root in $roots) {
              if ((Test-Path -LiteralPath (Join-Path $root 'candle.exe')) -and
                  (Test-Path -LiteralPath (Join-Path $root 'light.exe'))) {
                return (Resolve-Path -LiteralPath $root).Path
              }
            }
            if ($env:ChocolateyInstall) {
              $packageRoot = Join-Path $env:ChocolateyInstall 'lib\wixtoolset'
              $candlePath = Get-ChildItem -LiteralPath $packageRoot -Filter 'candle.exe' -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($candlePath) {
                $candidate = $candlePath.Directory.FullName
                if (Test-Path -LiteralPath (Join-Path $candidate 'light.exe')) { return $candidate }
              }
            }
            return $null
          }

          $wixBin = Find-WixBin
          if (-not $wixBin) {
            Write-Output '未找到可用的 WiX，开始安装。'
            choco install wixtoolset --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX 安装失败。' }
            if ($env:ChocolateyInstall) {
              Import-Module (Join-Path $env:ChocolateyInstall 'helpers\chocolateyProfile.psm1') -ErrorAction SilentlyContinue
              if (Get-Command refreshenv -ErrorAction SilentlyContinue) { refreshenv }
            }
            $wixBin = Find-WixBin
          }
          if (-not $wixBin) {
            throw '未找到 WiX 工具 candle.exe 和 light.exe，请确认 WiX 安装目录有效。'
          }
          $env:Path = "$wixBin;$env:Path"
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Output "复用已安装的 WiX：$wixBin"
          Write-Output "WiX candle：$((Get-Command candle.exe).Source)"
          Write-Output "WiX light：$((Get-Command light.exe).Source)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ needs.prepare.outputs.desktop_project }}/package-lock.json

      - name: Locate Node runtime license
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodeExecutable = (node -p "process.execPath").Trim()
          $nodeDirectory = Split-Path -Parent $nodeExecutable
          $candidates = @(
            $env:PRISM_NODE_LICENSE_PATH,
            (Join-Path $nodeDirectory 'LICENSE'),
            (Join-Path (Split-Path -Parent $nodeDirectory) 'LICENSE')
          ) | Where-Object { $_ }
          Write-Output "Node 可执行文件：$nodeExecutable"
          foreach ($candidate in $candidates) {
            Write-Output "Node 许可证候选路径：$candidate（$(if (Test-Path -LiteralPath $candidate) { '已找到' } else { '未找到' })）"
          }
          $license = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $license) { throw '未找到所选 Node runtime 对应的 LICENSE 文件。' }
          "PRISM_NODE_LICENSE_PATH=$license" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "使用 Node 许可证：$license"

      - name: Locate Node runtime license
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node <<'NODE'
          const { appendFileSync, existsSync } = require('node:fs');
          const { dirname, join, resolve } = require('node:path');

          const nodeDirectory = dirname(process.execPath);
          const candidates = [
            process.env.PRISM_NODE_LICENSE_PATH,
            join(nodeDirectory, 'LICENSE'),
            resolve(nodeDirectory, '..', 'LICENSE'),
          ].filter(Boolean);
          console.log(`Node executable: ${process.execPath}`);
          for (const candidate of candidates) {
            console.log(`Node license candidate: ${candidate} (${existsSync(candidate) ? 'found' : 'missing'})`);
          }
          const license = candidates.find((candidate) => existsSync(candidate));
          if (!license) {
            throw new Error('Node LICENSE not found next to the runtime selected by setup-node.');
          }
          appendFileSync(process.env.GITHUB_ENV, `PRISM_NODE_LICENSE_PATH=${license}\n`);
          console.log(`Using Node license: ${license}`);
          NODE

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: 获取 Rust 工具链缓存标识
        if: runner.os == 'Windows'
        id: rust-toolchain-windows
        shell: pwsh
        run: |
          $version = (rustc -vV | Out-String)
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($version)
          $hash = [System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)
          $key = (($hash | ForEach-Object { $_.ToString('x2') }) -join '').Substring(0, 16)
          "cache_key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Rust 工具链缓存标识：$key"

      - name: 获取 Rust 工具链缓存标识
        if: runner.os != 'Windows'
        id: rust-toolchain
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const version = execFileSync('rustc', ['-vV'], { encoding: 'utf8' });
          const key = createHash('sha256').update(version).digest('hex').slice(0, 16);
          appendFileSync(process.env.GITHUB_OUTPUT, `cache_key=${key}\n`);
          console.log(`Rust 工具链缓存标识：${key}`);
          NODE

      - name: 恢复 Cargo 下载缓存
        id: cargo-download-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-download-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', needs.prepare.outputs.desktop_project)) }}
          restore-keys: |
            cargo-download-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: 恢复 Rust release 编译缓存
        id: rust-release-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # 缓存依赖编译结果和应用主二进制；安装包与部署配置每次重新生成。
          path: |
            ${{ needs.prepare.outputs.desktop_project }}/src-tauri/target/release/.fingerprint
            ${{ needs.prepare.outputs.desktop_project }}/src-tauri/target/release/build
            ${{ needs.prepare.outputs.desktop_project }}/src-tauri/target/release/deps
            ${{ needs.prepare.outputs.desktop_project }}/src-tauri/target/release/prism-hub-desktop.exe
            ${{ needs.prepare.outputs.desktop_project }}/src-tauri/target/release/prism-hub-desktop.pdb
          key: rust-release-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain-windows.outputs.cache_key || steps.rust-toolchain.outputs.cache_key }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', needs.prepare.outputs.desktop_project), format('{0}/src-tauri/Cargo.toml', needs.prepare.outputs.desktop_project)) }}
          restore-keys: |
            rust-release-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain-windows.outputs.cache_key || steps.rust-toolchain.outputs.cache_key }}-

      - name: Install desktop dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ needs.prepare.outputs.desktop_project }}
        run: |
          if (Test-Path -LiteralPath 'package-lock.json') {
            npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
          } else {
            npm install --ignore-scripts --no-audit --no-fund --prefer-offline
          }
          if ($LASTEXITCODE -ne 0) { throw '桌面依赖安装失败。' }

      - name: Install desktop dependencies
        if: runner.os != 'Windows'
        working-directory: ${{ needs.prepare.outputs.desktop_project }}
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
          else
            npm install --ignore-scripts --no-audit --no-fund --prefer-offline
          fi

      - name: Run desktop workbench tests
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ needs.prepare.outputs.desktop_project }}
        run: |
          if ($env:DESKTOP_MODE -eq 'desktop-shell') {
            npm run test:workbench
          } else {
            npm run check
          }
          if ($LASTEXITCODE -ne 0) { throw '桌面工作台检查失败。' }

      - name: Run desktop workbench tests
        if: runner.os != 'Windows'
        working-directory: ${{ needs.prepare.outputs.desktop_project }}
        run: |
          if [[ "$DESKTOP_MODE" == "desktop-shell" ]]; then
            npm run test:workbench
          else
            npm run check
          fi

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo 'No macOS signing certificate configured; building an unsigned installer.'
            exit 0
          fi
          certificate_path="$RUNNER_TEMP/prism-hub-signing.p12"
          keychain_path="$RUNNER_TEMP/prism-hub-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          if [[ "$APPLE_SIGNING_IDENTITY" != Developer\ ID\ Application:* ]]; then
            echo 'APPLE_SIGNING_IDENTITY 必须是 Developer ID Application 证书。' >&2
            exit 1
          fi
          if ! security find-identity -v -p codesigning "$keychain_path" | grep -Fq "\"$APPLE_SIGNING_IDENTITY\""; then
            echo '导入的证书不包含配置的 APPLE_SIGNING_IDENTITY。' >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$api_key_path"
            echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          fi

      - name: Configure Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Output 'No Windows signing certificate configured; building an unsigned installer.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'prism-hub-signing.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 记录构建开始时间
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $startedAt = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "PRISM_BUILD_STARTED_AT=$startedAt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRISM_NATIVE_BUILD_STARTED_AT=$startedAt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 记录构建开始时间
        if: runner.os != 'Windows'
        shell: bash
        run: |
          started_at=$(date +%s)
          echo "PRISM_BUILD_STARTED_AT=${started_at}" >> "$GITHUB_ENV"
          echo "PRISM_NATIVE_BUILD_STARTED_AT=${started_at}" >> "$GITHUB_ENV"

      - name: Build native installers with Tauri Action
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          CI: 'true'
          # 手动 test/prod 构建和标签发布包启用更新；本地 dev 与 PR 校验不生成需要签名密钥的更新制品。
          PRISM_ENABLE_UPDATER: ${{ ((github.event_name == 'workflow_dispatch' && needs.prepare.outputs.environment != 'dev') || github.ref_type == 'tag') && '1' || '0' }}
          PRISM_BUNDLES: ${{ matrix.bundles }}
          PRISM_TAURI_VERBOSE: ${{ matrix.platform == 'linux-x64' && '1' || '' }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.appimage_extract_and_run }}
          DEBUG: ${{ matrix.platform == 'linux-x64' && '1' || '' }}
          RUST_LOG: ${{ matrix.tauri_log }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: ${{ needs.prepare.outputs.desktop_project }}
          # desktop-app owns deployment config, sidecar preparation and DMG
          # post-processing; desktop-shell can invoke Tauri directly.
          tauriScript: ${{ needs.prepare.outputs.desktop_mode == 'desktop-app' && format('npm run build:{0} --', needs.prepare.outputs.environment) || 'npx tauri' }}
          args: --bundles ${{ matrix.bundles }}
          retryAttempts: 1
          uploadWorkflowArtifacts: false
          uploadUpdaterJson: false

      - name: 输出原生构建耗时
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PRISM_NATIVE_BUILD_STARTED_AT -match '^\d+$') {
            $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:PRISM_NATIVE_BUILD_STARTED_AT
            Write-Output "::notice title=原生构建耗时::$elapsed 秒（${{ matrix.platform }}）"
          }

      - name: 输出原生构建耗时
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          started_at="${PRISM_NATIVE_BUILD_STARTED_AT:-}"
          if [[ "$started_at" =~ ^[0-9]+$ ]]; then
            elapsed=$(( $(date +%s) - started_at ))
            echo "::notice title=原生构建耗时::${elapsed} 秒（${{ matrix.platform }}）"
          fi

      - name: 公证并装订 macOS 安装包
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        working-directory: ${{ needs.prepare.outputs.desktop_project }}
        run: |
          set -euo pipefail
          for variable in APPLE_SIGNING_IDENTITY APPLE_API_KEY_PATH APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!variable:-}" ]]; then
              echo "macOS 发布缺少公证配置：${variable}" >&2
              exit 1
            fi
          done

          shopt -s nullglob
          dmg_files=(src-tauri/target/release/bundle/dmg/*.dmg)
          if (( ${#dmg_files[@]} == 0 )); then
            echo '未找到待公证的 macOS DMG 安装包。' >&2
            exit 1
          fi

          app_bundles=(src-tauri/target/release/bundle/macos/*.app)
          if (( ${#app_bundles[@]} == 0 )); then
            echo '未找到待公证的 macOS 应用包。' >&2
            exit 1
          fi
          for app_bundle in "${app_bundles[@]}"; do
            codesign --verify --deep --strict --verbose=4 "$app_bundle"
            signing_details="$(codesign -dvv "$app_bundle" 2>&1)"
            if ! grep -Fq 'Authority=Developer ID Application:' <<< "$signing_details"; then
              echo "应用包未使用 Developer ID Application 签名：${app_bundle}" >&2
              exit 1
            fi
            if ! grep -Eq 'flags=.*runtime' <<< "$signing_details"; then
              echo "应用包未启用 Hardened Runtime：${app_bundle}" >&2
              exit 1
            fi
            sidecar_path="$app_bundle/Contents/Resources/resources/bin/prism-sidecar"
            if [[ ! -f "$sidecar_path" ]]; then
              echo "应用包缺少 Prism Hub sidecar：${sidecar_path}" >&2
              exit 1
            fi
            codesign --verify --strict --verbose=4 "$sidecar_path"
            sidecar_signing_details="$(codesign -dvv "$sidecar_path" 2>&1)"
            if ! grep -Fq 'Authority=Developer ID Application:' <<< "$sidecar_signing_details"; then
              echo "sidecar 未使用 Developer ID Application 签名：${sidecar_path}" >&2
              exit 1
            fi
            if ! grep -Eq 'flags=.*runtime' <<< "$sidecar_signing_details"; then
              echo "sidecar 未启用 Hardened Runtime：${sidecar_path}" >&2
              exit 1
            fi
            if ! grep -Fq 'Timestamp=' <<< "$sidecar_signing_details"; then
              echo "sidecar 缺少可信时间戳：${sidecar_path}" >&2
              exit 1
            fi
          done

          for dmg_file in "${dmg_files[@]}"; do
            echo "开始签名 macOS 安装包：$(basename "$dmg_file")"
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg_file"
            codesign --verify --verbose=4 "$dmg_file"
            dmg_signing_details="$(codesign -dvv "$dmg_file" 2>&1)"
            if ! grep -Fq 'Authority=Developer ID Application:' <<< "$dmg_signing_details"; then
              echo "DMG 未使用 Developer ID Application 签名：${dmg_file}" >&2
              exit 1
            fi
            if ! grep -Fq 'Timestamp=' <<< "$dmg_signing_details"; then
              echo "DMG 缺少可信时间戳：${dmg_file}" >&2
              exit 1
            fi
            echo "开始提交 Apple 公证：$(basename "$dmg_file")"
            submission="$(xcrun notarytool submit "$dmg_file" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --output-format json)"
            submission_id="$(jq -r '.id // empty' <<< "$submission")"
            submission_status="$(jq -r '.status // empty' <<< "$submission")"
            if [[ -z "$submission_id" || "$submission_status" != 'Accepted' ]]; then
              echo "Apple 公证未通过，提交状态：${submission_status:-未知}" >&2
              if [[ -n "$submission_id" ]]; then
                log_path="$RUNNER_TEMP/notary-${submission_id}.json"
                xcrun notarytool log "$submission_id" "$log_path" \
                  --key "$APPLE_API_KEY_PATH" \
                  --key-id "$APPLE_API_KEY_ID" \
                  --issuer "$APPLE_API_ISSUER" || true
                if [[ -f "$log_path" ]]; then
                  jq '{status, issues}' "$log_path" || true
                fi
              else
                jq . <<< "$submission" || true
              fi
              exit 1
            fi
            echo "开始装订公证票据：$(basename "$dmg_file")"
            xcrun stapler staple -v "$dmg_file"
            xcrun stapler validate -v "$dmg_file"
            spctl --assess --type open --context context:primary-signature -vv "$dmg_file"
          done

      - name: 保存 Cargo 下载缓存
        if: github.ref_type != 'tag' && steps.cargo-download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-download-cache.outputs.cache-primary-key }}

      - name: 保存 Rust release 编译缓存
        if: github.ref_type != 'tag' && steps.rust-release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ needs.prepare.outputs.desktop_project }}/src-tauri/target/release/.fingerprint
            ${{ needs.prepare.outputs.desktop_project }}/src-tauri/target/release/build
            ${{ needs.prepare.outputs.desktop_project }}/src-tauri/target/release/deps
            ${{ needs.prepare.outputs.desktop_project }}/src-tauri/target/release/prism-hub-desktop.exe
            ${{ needs.prepare.outputs.desktop_project }}/src-tauri/target/release/prism-hub-desktop.pdb
          key: ${{ steps.rust-release-cache.outputs.cache-primary-key }}

      - name: Verify thin Desktop resources
        if: needs.prepare.outputs.desktop_mode == 'desktop-app' && runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($removed in @('plugins', 'sdk', 'runtime')) {
            if (Test-Path -LiteralPath "desktop-app/resources/$removed") {
              throw "Desktop installer input must not contain resources/$removed."
            }
          }
          if (-not (Test-Path -LiteralPath 'desktop-app/resources/bin/prism-sidecar.exe')) {
            throw '缺少 Windows Prism Hub sidecar。'
          }

      - name: Verify thin Desktop resources
        if: needs.prepare.outputs.desktop_mode == 'desktop-app' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for removed in plugins sdk runtime; do
            if [[ -e "desktop-app/resources/${removed}" ]]; then
              echo "Desktop installer input must not contain resources/${removed}." >&2
              exit 1
            fi
          done
          test -f "desktop-app/resources/bin/prism-sidecar" || test -f "desktop-app/resources/bin/prism-sidecar.exe"

      - name: Sign Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ needs.prepare.outputs.desktop_project }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PATH)) {
            Write-Output '未配置 Windows 签名证书，跳过安装包签名。'
            exit 0
          }
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw 'signtool.exe was not found on the runner.' }
          Get-ChildItem 'src-tauri\target\release\bundle' -Recurse -Include *.exe,*.msi | ForEach-Object {
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($_.FullName)" }
            & $signtool verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($_.FullName)" }
          }

      - name: Regenerate Tauri update signatures after Windows code signing
        if: runner.os == 'Windows' && ((github.event_name == 'workflow_dispatch' && needs.prepare.outputs.environment != 'dev') || github.ref_type == 'tag')
        shell: pwsh
        working-directory: ${{ needs.prepare.outputs.desktop_project }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required for updater packages.'
          }
          Get-ChildItem 'src-tauri\target\release\bundle' -Recurse -Include *.exe,*.msi | ForEach-Object {
            Remove-Item -LiteralPath "$($_.FullName).sig" -ErrorAction SilentlyContinue
            npx tauri signer sign $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Tauri updater signing failed: $($_.FullName)" }
          }

      - name: 验证 Windows 安装包与更新制品
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ needs.prepare.outputs.desktop_project }}
        env:
          PRISM_UPDATER_ENABLED: ${{ ((github.event_name == 'workflow_dispatch' && needs.prepare.outputs.environment != 'dev') || github.ref_type == 'tag') && '1' || '0' }}
        run: |
          $nsisPackages = @(Get-ChildItem 'src-tauri\target\release\bundle\nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          $msiPackages = @(Get-ChildItem 'src-tauri\target\release\bundle\msi' -Filter '*.msi' -File -ErrorAction SilentlyContinue)
          if ($nsisPackages.Count -ne 1) {
            throw "NSIS 安装包数量异常：期望 1 个，实际 $($nsisPackages.Count) 个。"
          }
          if ($msiPackages.Count -ne 1) {
            throw "MSI 安装包数量异常：期望 1 个，实际 $($msiPackages.Count) 个。"
          }
          Write-Output "NSIS 安装包：$($nsisPackages[0].FullName)"
          Write-Output "MSI 安装包：$($msiPackages[0].FullName)"
          if ($env:PRISM_UPDATER_ENABLED -eq '1') {
            foreach ($package in @($nsisPackages + $msiPackages)) {
              $signature = "$($package.FullName).sig"
              if (-not (Test-Path -LiteralPath $signature)) {
                throw "缺少 Tauri 更新签名：$signature"
              }
              if ((Get-Item -LiteralPath $signature).Length -eq 0) {
                throw "Tauri 更新签名为空：$signature"
              }
            }
            Write-Output 'Windows 更新制品签名校验通过。'
          } else {
            Write-Output '当前构建未启用更新制品，跳过 .sig 校验。'
          }

      - name: Stage Unix installers
        if: runner.os != 'Windows' && github.event_name != 'pull_request'
        working-directory: ${{ needs.prepare.outputs.desktop_project }}
        run: |
          set -euo pipefail
          destination="../release-files/${{ matrix.platform }}"
          mkdir -p "$destination"
          {
            echo "platform=${{ matrix.platform }}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            du -sk resources 2>/dev/null || true
            find src-tauri/target/release/bundle -type d -name '*.app' -prune -exec du -sk {} \; 2>/dev/null || true
            find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \) -exec du -k {} \; 2>/dev/null || true
          } > "$destination/bundle-sizes.txt"
          while IFS= read -r -d '' artifact; do
            name="$(basename "$artifact")"
            sanitized_name="${name// /}"
            target="$destination/$sanitized_name"
            if [[ -e "$target" ]]; then
              echo "Installer filename collision after removing spaces: $sanitized_name" >&2
              exit 1
            fi
            cp "$artifact" "$target"
          done < <(find src-tauri/target/release/bundle -type f \( \
            -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o \
            -name '*.tar.gz' -o -name '*.sig' \
          \) -print0)
          test -n "$(find "$destination" -type f -print -quit)"

      - name: Stage Windows installers
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: pwsh
        working-directory: ${{ needs.prepare.outputs.desktop_project }}
        run: |
          $destination = "..\release-files\${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Get-ChildItem 'src-tauri\target\release\bundle' -Recurse -Include *.exe,*.msi,*.sig | ForEach-Object {
            $sanitizedName = $_.Name -replace ' ', ''
            $target = Join-Path $destination $sanitizedName
            if (Test-Path -LiteralPath $target) { throw "Installer filename collision after removing spaces: $sanitizedName" }
            Copy-Item -LiteralPath $_.FullName -Destination $target
          }
          if (-not (Get-ChildItem $destination -File)) { throw 'Tauri did not produce a Windows installer.' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        env:
          # Limit upload concurrency and chunk size to improve retry behavior.
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: 1
          ACTIONS_ARTIFACT_UPLOAD_CHUNK_SIZE: 8388608
        with:
          name: prism-hub-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: release-files
          if-no-files-found: error
          retention-days: 1
          # 安装包本身已压缩，避免再次压缩占用 runner CPU。
          compression-level: 0

      - name: 输出构建摘要
        if: always() && runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-download-cache.outputs.cache-hit }}
          RUST_CACHE_HIT: ${{ steps.rust-release-cache.outputs.cache-hit }}
        run: |
          $elapsed = '-'
          if ($env:PRISM_BUILD_STARTED_AT -match '^\d+$') {
            $elapsed = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:PRISM_BUILD_STARTED_AT).ToString()
          }
          @(
            '### 桌面构建摘要',
            '',
            '- 平台：${{ matrix.platform }}',
            '- 安装包：${{ matrix.bundles }}',
            '- Runner：${{ runner.name }}',
            '- 触发方式：${{ github.event_name }}',
            "- 构建阶段总耗时：$elapsed 秒",
            "- Cargo 下载缓存命中：$($env:CARGO_CACHE_HIT ?? 'false')",
            "- Rust 编译缓存命中：$($env:RUST_CACHE_HIT ?? 'false')"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: 输出构建摘要
        if: always() && runner.os != 'Windows'
        shell: bash
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-download-cache.outputs.cache-hit }}
          RUST_CACHE_HIT: ${{ steps.rust-release-cache.outputs.cache-hit }}
        run: |
          started_at="${PRISM_BUILD_STARTED_AT:-}"
          elapsed="-"
          if [[ "$started_at" =~ ^[0-9]+$ ]]; then
            elapsed="$(( $(date +%s) - started_at ))"
          fi
          {
            echo "### 桌面构建摘要"
            echo ""
            echo "- 平台：${{ matrix.platform }}"
            echo "- 安装包：${{ matrix.bundles }}"
            echo "- 触发方式：${{ github.event_name }}"
            echo "- 构建阶段总耗时：${elapsed} 秒"
            echo "- Cargo 下载缓存命中：${CARGO_CACHE_HIT:-false}"
            echo "- Rust 编译缓存命中：${RUST_CACHE_HIT:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-22.04
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      RELEASE_PLATFORMS: ${{ needs.prepare.outputs.selected_platforms }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL }}
      OSS_PREFIX: ${{ vars.OSS_PREFIX }}
      API_RELEASE_REGISTRATION_URL: ${{ vars.API_RELEASE_REGISTRATION_URL }}
      API_RELEASE_TOKEN: ${{ secrets.API_RELEASE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: prism-hub-${{ needs.prepare.outputs.version }}-*
          path: release-files
          merge-multiple: true

      - name: 缓存 OSS 上传依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-oss2-2.19.1-v1

      - name: Validate publishing configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET OSS_BUCKET OSS_ENDPOINT OSS_PUBLIC_BASE_URL API_RELEASE_REGISTRATION_URL API_RELEASE_TOKEN; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required publish configuration: ${variable}" >&2
              exit 1
            fi
          done
          : "${OSS_PREFIX:=prism}"
          echo "OSS_PREFIX=${OSS_PREFIX#/}" >> "$GITHUB_ENV"

      - name: Generate checksums and Panel release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          root = Path('release-files')
          version = os.environ['RELEASE_VERSION']
          environment = os.environ['RELEASE_ENVIRONMENT']
          selected_platforms = {
              platform for platform in os.environ['RELEASE_PLATFORMS'].split(',') if platform
          }
          public_base = os.environ['OSS_PUBLIC_BASE_URL'].rstrip('/')
          prefix = os.environ.get('OSS_PREFIX', 'prism').strip('/')
          release_prefix = f'{environment}/{prefix}/release'
          default_extensions = {
              'macos-arm64': '.dmg',
              'macos-x64': '.dmg',
              'windows-x64': '.exe',
              'linux-x64': '.AppImage',
          }
          updater_specs = {
              'macos-arm64': ('.tar.gz', 'darwin-aarch64'),
              'macos-x64': ('.tar.gz', 'darwin-x86_64'),
              'windows-x64': ('.exe', 'windows-x86_64-nsis'),
              'linux-x64': ('.AppImage', 'linux-x86_64-appimage'),
          }

          assets = []
          downloads = {}
          updater = {}
          for platform_dir in sorted(path for path in root.iterdir() if path.is_dir()):
              platform = platform_dir.name
              platform_assets = []
              for artifact in sorted(
                  path for path in platform_dir.iterdir()
                  if path.is_file() and path.name != 'bundle-sizes.txt'
              ):
                  digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
                  key = f'{release_prefix}/{platform}/{artifact.name}'
                  asset = {
                      'platform': platform,
                      'kind': artifact.suffix.removeprefix('.').lower(),
                      'fileName': artifact.name,
                      'url': f'{public_base}/{quote(key)}',
                      'sha256': digest,
                      'size': artifact.stat().st_size,
                  }
                  assets.append(asset)
                  platform_assets.append(asset)
              preferred = next((asset for asset in platform_assets if asset['fileName'].endswith(default_extensions.get(platform, ''))), None)
              if preferred:
                  downloads[platform] = {
                      'url': preferred['url'],
                      'version': version,
                      'sha256': preferred['sha256'],
                      'fileName': preferred['fileName'],
                      'size': preferred['size'],
                  }
              updater_extension, updater_target = updater_specs[platform]
              updater_asset = next((asset for asset in platform_assets if asset['fileName'].endswith(updater_extension)), None)
              available_files = ', '.join(asset['fileName'] for asset in platform_assets) or '(none)'
              if not updater_asset:
                  raise SystemExit(
                      f'Missing Tauri updater artifact for {platform}: expected *{updater_extension}; '
                      f'available files: {available_files}'
                  )
              signature_path = platform_dir / f"{updater_asset['fileName']}.sig"
              if not signature_path.is_file():
                  raise SystemExit(
                      f'Missing Tauri updater signature for {platform}: expected {signature_path.name}; '
                      f'available files: {available_files}'
                  )
              print(
                  f'Resolved Tauri updater for {platform}: '
                  f'artifact={updater_asset["fileName"]}, signature={signature_path.name}'
              )
              signature = signature_path.read_text(encoding='utf-8').strip()
              if not signature:
                  raise SystemExit(f'Empty Tauri updater signature for {platform}')
              updater[updater_target] = {
                  'url': updater_asset['url'],
                  'signature': signature,
              }

          expected = {path.name for path in root.iterdir() if path.is_dir()}
          if expected != selected_platforms:
              missing = ', '.join(sorted(selected_platforms - expected)) or '(无)'
              unexpected = ', '.join(sorted(expected - selected_platforms)) or '(无)'
              raise SystemExit(
                  f'发布产物与所选平台不一致：缺少 {missing}；额外 {unexpected}'
              )
          unsupported = expected - set(default_extensions)
          if unsupported:
              raise SystemExit(f'Unexpected platform artifact directory(s): {", ".join(sorted(unsupported))}')
          if set(downloads) != expected:
              missing = ', '.join(sorted(expected - set(downloads)))
              raise SystemExit(f'Missing primary installer(s): {missing}')
          if len(updater) != len(expected):
              raise SystemExit('Missing Tauri updater artifact(s)')

          print(f'本次仅发布所选平台：{", ".join(sorted(expected))}')

          manifest = {
              'version': version,
              'channel': environment,
              'publishedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'downloads': downloads,
              'updater': updater,
              'assets': assets,
          }
          Path('release.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('SHA256SUMS').write_text('\n'.join(f"{asset['sha256']}  {asset['platform']}/{asset['fileName']}" for asset in assets) + '\n', encoding='utf-8')
          PY
          jq . release.json
          # Size reports remain attached to the per-platform Actions artifacts,
          # but are not product release assets.
          find release-files -type f -name bundle-sizes.txt -delete

      - name: Upload immutable release artifacts and current manifest to OSS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'oss2==2.19.1'
          python3 <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import mimetypes
          import os
          from pathlib import Path
          import time
          import oss2

          upload_started_at = time.monotonic()
          auth = oss2.Auth(os.environ['OSS_ACCESS_KEY_ID'], os.environ['OSS_ACCESS_KEY_SECRET'])
          endpoint = os.environ['OSS_ENDPOINT']
          bucket_name = os.environ['OSS_BUCKET']
          environment = os.environ['RELEASE_ENVIRONMENT']
          prefix = os.environ.get('OSS_PREFIX', 'prism').strip('/')
          version = os.environ['RELEASE_VERSION']
          release_prefix = f'{environment}/{prefix}/release'

          def upload_artifact(artifact, key, content_type):
              # 每个线程使用独立客户端，避免共享 HTTP 会话的并发风险。
              size_mb = artifact.stat().st_size / 1024 / 1024
              started_at = time.monotonic()
              print(f'开始上传：{artifact}（{size_mb:.2f} MiB）', flush=True)
              bucket = oss2.Bucket(auth, endpoint, bucket_name, connect_timeout=30)
              last_logged = [0]

              def report_progress(consumed, total):
                  # 分块回调确保长时间网络请求期间仍能看到进度。
                  if consumed == total or consumed - last_logged[0] >= 4 * 1024 * 1024:
                      percent = consumed * 100 / total if total else 100
                      print(f'上传进度：{artifact.name} {consumed / 1024 / 1024:.2f}/{total / 1024 / 1024:.2f} MiB（{percent:.0f}%）', flush=True)
                      last_logged[0] = consumed

              # 当前 AccessKey 仅具备对象写入权限，不调用需要 ListParts 权限的断点续传 API。
              bucket.put_object_from_file(key, str(artifact), headers={
                  'Content-Type': content_type,
                  'Cache-Control': 'public, max-age=31536000, immutable',
                  }, progress_callback=report_progress)
              elapsed = time.monotonic() - started_at
              print(f'上传完成：{key}，耗时 {elapsed:.1f} 秒，平均 {size_mb / max(elapsed, 0.001):.2f} MiB/s', flush=True)
              return elapsed

          artifacts = []
          for platform_dir in sorted(path for path in Path('release-files').iterdir() if path.is_dir()):
              for artifact in sorted(path for path in platform_dir.iterdir() if path.is_file()):
                  key = f'{release_prefix}/{platform_dir.name}/{artifact.name}'
                  content_type = mimetypes.guess_type(artifact.name)[0] or 'application/octet-stream'
                  artifacts.append((artifact, key, content_type))

          # 安装包互不依赖；限制为两路，避免跨网带宽竞争导致所有请求同时变慢。
          with ThreadPoolExecutor(max_workers=min(2, len(artifacts) or 1)) as executor:
              futures = [executor.submit(upload_artifact, *artifact) for artifact in artifacts]
              for index, future in enumerate(as_completed(futures), 1):
                  future.result()
                  print(f'安装包上传进度：{index}/{len(futures)}', flush=True)

          manifest_key = f'{release_prefix}/release.json'
          bucket = oss2.Bucket(auth, endpoint, bucket_name)
          for key, source, content_type in (
              (f'{release_prefix}/SHA256SUMS', 'SHA256SUMS', 'text/plain; charset=utf-8'),
              (manifest_key, 'release.json', 'application/json'),
          ):
              if not key.startswith(f'{release_prefix}/'):
                  raise SystemExit(f'Refusing to upload outside the release prefix: {key}')
              started_at = time.monotonic()
              print(f'开始上传清单：{source} -> oss://{bucket_name}/{key}', flush=True)
              bucket.put_object_from_file(key, source, headers={
                  'Content-Type': content_type,
                  'Cache-Control': 'no-cache, no-store, must-revalidate',
              })
              print(f'清单上传完成：{key}，耗时 {time.monotonic() - started_at:.1f} 秒', flush=True)
          print(f'OSS 上传全部完成，总耗时 {time.monotonic() - upload_started_at:.1f} 秒', flush=True)
          PY

      - name: Register published release with Prism API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST "$API_RELEASE_REGISTRATION_URL" \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $API_RELEASE_TOKEN" \
            --data @release.json

      - name: Create GitHub release for tag builds
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "Prism Hub v${RELEASE_VERSION}" \
            --generate-notes \
            release-files/*/* SHA256SUMS release.json

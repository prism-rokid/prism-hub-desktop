[package]
name = "prism-hub-desktop"
version = "0.1.17"
description = "Prism Hub desktop shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14.1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.10.1"
# Cargo.lock carries glib 0.18 (GHSA-wrw7-89jp-8q8g, unsound VariantStrIter)
# as a Linux-only transitive dependency of tauri/wry. The shell never touches
# glib directly and no fixed glib 0.20 is reachable while tauri pins gtk 0.18;
# the Dependabot alert is dismissed as tolerable risk. Re-evaluate on every
# tauri upgrade and bump the lockfile as soon as gtk 0.20 lands.

  <script src="https://unpkg.com/lucide@1.27.0/dist/umd/lucide.min.js"></script>
  <script>
    const dashboardTranslations = {{.Translations}};
    const state = {
      lastStatus: null,
      lastHostPlugins: null,
      page: "login",
      region: "cn",
      locale: "en-US",
      theme: "light",
      themePreference: "system",
      openAgentMenuId: null,
      pluginCatalog: null,
      pluginCatalogOperations: new Map(),
      pluginManagerPreviousFocus: null,
      doctorPanelOpen: false,
      doctorPanelPreviousFocus: null,
      lastDoctorReport: null,
      doctorReportRevision: 0,
      doctorReportInFlight: null,
      doctorRunning: false,
      lastAutoHealToastAt: "",
      refreshTimer: null,
      settleTimers: new Set(),
      refreshInFlight: null,
      lastHostPluginsAt: 0,
      statusRenderFingerprint: "",
      toastTimer: null,
      reauthRequired: false,
      loginSubmitting: false,
      loginTransition: false,
      loginTransitionTimer: null,
      authRevision: 0,
      confirmationResolve: null,
      confirmationPreviousFocus: null,
      agentMetadataPluginId: "",
      recoveryActions: new Set(),
      managedLaunches: new Set(),
      recoveryNoticesCollapsed: false,
      recoveryNoticeCount: 0,
      browserOnline: navigator.onLine !== false,
      desktopWindowVisible: true,
      desktopHubLifecycle: "",
      awaitingHubRestart: false,
      hubRestartWatchInFlight: false,
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function localeStorageKey() { return "prism.dashboard.locale"; }
    function supportedLocale(value) { return Object.hasOwn(dashboardTranslations, value) ? value : ""; }
    function detectLocale() {
      try { const saved = supportedLocale(window.localStorage.getItem(localeStorageKey())); if (saved) return saved; } catch {}
      for (const candidate of [...(navigator.languages || []), navigator.language]) {
        const value = String(candidate || "").toLowerCase();
        if (value.startsWith("zh")) return "zh-CN";
        if (value.startsWith("ja")) return "ja-JP";
        if (value.startsWith("en")) return "en-US";
      }
      return "en-US";
    }
    function t(key, params = {}) {
      const value = dashboardTranslations[state.locale]?.[key] || dashboardTranslations["en-US"]?.[key] || key;
      return value.replace(/\{([A-Za-z][A-Za-z0-9_]*)\}/g, (_, name) => String(params[name] ?? `{${name}}`));
    }
    function applyTranslations() {
      document.documentElement.lang = state.locale;
      document.querySelectorAll("[data-i18n]").forEach((element) => { element.textContent = t(element.dataset.i18n); });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => { element.placeholder = t(element.dataset.i18nPlaceholder); });
      document.querySelectorAll("[data-i18n-title]").forEach((element) => { element.title = t(element.dataset.i18nTitle); });
      document.querySelectorAll("[data-i18n-aria-label]").forEach((element) => { element.setAttribute("aria-label", t(element.dataset.i18nAriaLabel)); });
      const localeValue = document.getElementById("locale-value");
      if (localeValue) localeValue.textContent = t(`language.${state.locale.replace("-", "_").toLowerCase()}`);
      document.querySelectorAll("[data-locale]").forEach((option) => option.classList.toggle("active", option.dataset.locale === state.locale));
      renderDesktopUpdateEntry();
    }
    // Desktop updater state mirrored from the shell: "idle" (nothing known),
    // "available" (the shell found a newer version), "installing" (download in
    // flight, progress mirrored into the Dashboard action).
    const desktopUpdate = { state: "idle", version: "", progress: null };
    function renderDesktopUpdateEntry() {
      const button = document.getElementById("check-update-btn");
      const label = document.getElementById("check-update-label");
      const badge = document.getElementById("update-badge");
      const progress = document.getElementById("drawer-update-progress");
      const fill = document.getElementById("drawer-update-progress-fill");
      const topButton = document.getElementById("desktop-update-btn");
      const topLabel = document.getElementById("desktop-update-label");
      const ringFill = document.getElementById("desktop-update-ring-fill");
      if (!button || !label || !badge || !progress || !fill || !topButton || !topLabel || !ringFill) return;
      const available = desktopUpdate.state === "available";
      const installing = desktopUpdate.state === "installing";
      const percent = desktopUpdate.progress?.total
        ? Math.min(100, Math.floor((desktopUpdate.progress.downloaded / desktopUpdate.progress.total) * 100))
        : null;
      label.textContent = installing
        ? t("drawer.updating")
        : available ? t("drawer.install_update") : t("drawer.check_update");
      badge.hidden = !(available || installing);
      badge.textContent = installing && percent !== null ? `${percent}%` : t("drawer.new_version");
      button.classList.toggle("update-ready", available);
      button.disabled = installing;
      progress.setAttribute("aria-hidden", installing ? "false" : "true");
      fill.style.width = installing && percent !== null ? `${Math.max(4, percent)}%` : "0%";
      // Top-bar ring mirrors the same download progress as a static arc; the
      // 6% floor keeps the ring legible before the first progress event lands.
      const ringPercent = installing ? (percent === null ? 6 : Math.max(6, percent)) : 0;
      ringFill.style.strokeDashoffset = (50.27 * (1 - ringPercent / 100)).toFixed(2);

      // The top-bar affordance is deliberately shown only after the native
      // updater has verified a newer signed release. Its first click starts
      // installation immediately; no arm/confirm click is required.
      topButton.hidden = !(available || installing);
      topButton.disabled = installing;
      topButton.classList.toggle("is-installing", installing);
      const topAction = installing ? t("drawer.updating") : t("agent.update");
      topButton.setAttribute("aria-label", topAction);
      topButton.setAttribute("title", topAction);
      topLabel.textContent = topAction;
    }
    function setLocale(locale) {
      state.locale = supportedLocale(locale) || "en-US";
      try { window.localStorage.setItem(localeStorageKey(), state.locale); } catch {}
      applyTranslations();
      if (window.parent !== window) window.parent.postMessage({ type: "prism:locale-change", locale: state.locale }, "*");
      if (state.lastStatus) applyStatus(state.lastStatus, { force: true });
      if (!document.getElementById("plugin-manager-overlay").hidden) renderPluginCatalog();
    }

    function renderLucideIcons(root = document) {
      if (!window.lucide?.createIcons) return;
      window.lucide.createIcons({
        root,
        attrs: {
          "aria-hidden": "true",
          "stroke-width": "1.8",
        },
      });
    }

    function initialsForAccount(name) {
      const value = String(name || "").trim();
      if (!value) return "PR";
      const parts = value.split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return value.slice(0, 2).toUpperCase();
    }

    function statusBadge(text, tone = "") {
      return `<span class="badge ${tone}">${escapeHtml(text)}</span>`;
    }

    function setScopedMessage(id, text, tone = "") {
      // Plugin management actions used to render status text directly above the
      // Agent list. Keep that area stable and surface every outcome as a Toast.
      if (id === "plugins-message") {
        if (text) showToast(text, tone === "err" ? "err" : "ok");
        const pluginMessage = document.getElementById(id);
        if (pluginMessage) {
          pluginMessage.textContent = "";
          pluginMessage.className = "message";
        }
        return;
      }
      const element = document.getElementById(id);
      if (!element) return;
      element.textContent = text || "";
      element.className = `message ${tone}`.trim();
    }

    function showToast(message, tone = "ok") {
      const toast = document.getElementById("toast");
      if (!toast) return;
      if (state.toastTimer) window.clearTimeout(state.toastTimer);
      const icon = tone === "err" ? "circle-alert" : "circle-check";
      toast.className = `toast ${tone}`;
      toast.innerHTML = `<i data-lucide="${icon}" aria-hidden="true"></i><span>${escapeHtml(message)}</span>`;
      renderLucideIcons(toast);
      window.requestAnimationFrame(() => toast.classList.add("show"));
      state.toastTimer = window.setTimeout(() => toast.classList.remove("show"), 4400);
    }

    // WKWebView in the packaged Tauri application does not consistently expose
    // window.confirm(). Keep disruptive actions explicitly confirmed in the
    // dashboard instead of silently treating the action as cancelled.
    function requestDashboardConfirmation(message, { title = t("common.confirm"), confirmText = t("common.continue"), tone = "default" } = {}) {
      const overlay = document.getElementById("confirmation-overlay");
      const dialog = overlay?.querySelector(".confirmation-dialog");
      const titleElement = document.getElementById("confirmation-title");
      const messageElement = document.getElementById("confirmation-message");
      const acceptButton = document.getElementById("confirmation-accept");
      if (!overlay || !dialog || !titleElement || !messageElement || !acceptButton) {
        return Promise.resolve(false);
      }
      if (state.confirmationResolve) state.confirmationResolve(false);
      titleElement.textContent = title;
      messageElement.textContent = message;
      acceptButton.textContent = confirmText;
      dialog.dataset.tone = tone === "danger" ? "danger" : "default";
      state.confirmationPreviousFocus = document.activeElement;
      overlay.hidden = false;
      window.setTimeout(() => acceptButton.focus(), 0);
      return new Promise((resolve) => { state.confirmationResolve = resolve; });
    }

    function finishDashboardConfirmation(accepted) {
      const overlay = document.getElementById("confirmation-overlay");
      const resolve = state.confirmationResolve;
      state.confirmationResolve = null;
      if (overlay) overlay.hidden = true;
      overlay?.querySelector(".confirmation-dialog")?.removeAttribute("data-tone");
      const previousFocus = state.confirmationPreviousFocus;
      state.confirmationPreviousFocus = null;
      if (previousFocus?.focus) previousFocus.focus();
      resolve?.(Boolean(accepted));
    }

    function dashboardRequestMessage(error, fallback = t("error.request_failed")) {
      const message = String(error?.message || error || "").trim();
      if (!message || message === "Failed to fetch" || /networkerror|network request failed/i.test(message)) {
        return t("error.connection_lost");
      }
      return message || fallback;
    }

    function runDashboardAction(messageElementId, action) {
      Promise.resolve()
        .then(action)
        .catch((error) => setScopedMessage(messageElementId, dashboardRequestMessage(error), "err"));
    }

    function pluginModeFor(config, pluginId) {
      const id = String(pluginId || "").toLowerCase();
      return String(config?.plugin_modes?.[id] || "").toLowerCase();
    }

    function pluginRuntimeModes(plugin) {
      return Array.isArray(plugin?.runtime_modes)
        ? plugin.runtime_modes.map((mode) => String(mode || "").trim()).filter(Boolean)
        : [];
    }

    function hostPlugins() {
      return Array.isArray(state.lastHostPlugins?.items) ? state.lastHostPlugins.items : [];
    }

    function hostPluginFor(pluginId) {
      const target = String(pluginId || "").trim().toLowerCase();
      return hostPlugins().find((item) => String(item.plugin_id || "").trim().toLowerCase() === target) || null;
    }

    function localPresentation(item, persisted) {
      const result = {
        ...item,
        plugin_id: String(item?.plugin_id || "").toLowerCase(),
        manifest_icon_url: String(item?.icon_url || "").trim(),
        manifest_icon_svg_url: String(item?.icon_svg_url || "").trim(),
        user_icon_url: String(persisted?.icon_url || "").trim(),
      };
      for (const key of ["display_name", "description", "version", "integration_mode"]) {
        const value = String(persisted?.[key] || "").trim();
        if (value) result[key] = value;
      }
      return result;
    }

    function cloudConnectionActive(data = state.lastStatus) {
      return Boolean(data && String(data.connection_state || "").toLowerCase() === "connected" && state.browserOnline);
    }

    function cloudConnectionPending(data = state.lastStatus) {
      const connectionState = String(data?.connection_state || "").toLowerCase();
      return Boolean(data && state.browserOnline && ["connecting", "reconnecting"].includes(connectionState));
    }

    function cloudConnectionUsable(data = state.lastStatus) {
      return cloudConnectionActive(data) || cloudConnectionPending(data);
    }

    function cloudConnectionLabel(data = state.lastStatus) {
      if (cloudConnectionActive(data)) return t("status.connected");
      if (cloudConnectionPending(data)) return t("status.connecting");
      return t("status.disconnected");
    }

    function hostPluginSyncPresentation(data = state.lastStatus) {
      const syncState = String(data?.host_plugin_sync_state || "").toLowerCase();
      const count = Number(data?.host_plugin_count || 0);
      switch (syncState) {
        case "synced":
          return { label: count > 0 ? `${t("status.host_plugin_synced")} (${count})` : t("status.host_plugin_synced"), healthy: true };
        case "syncing":
          return { label: t("status.host_plugin_syncing"), healthy: true };
        case "stale":
          return { label: t("status.host_plugin_stale"), healthy: false };
        case "auth_required":
          return { label: t("status.host_plugin_auth_required"), healthy: false };
        case "error":
          return { label: t("status.host_plugin_error"), healthy: false };
        default:
          return { label: t("status.checking"), healthy: false };
      }
    }

    function recoveryActionMarkup({ action, key, label, icon, disabled = false, data = {} }) {
      const working = state.recoveryActions.has(key);
      const unavailable = Boolean(disabled);
      const attributes = Object.entries(data)
        .map(([name, value]) => `data-recovery-${escapeHtml(name)}="${escapeHtml(value)}"`)
        .join(" ");
      return `<button class="recovery-action" type="button" data-recovery-action="${escapeHtml(action)}" data-recovery-key="${escapeHtml(key)}" ${attributes} ${working || unavailable ? "disabled" : ""} ${working ? 'data-recovering="true" aria-busy="true"' : ""}>
        <i data-lucide="${working ? "loader-circle" : escapeHtml(icon)}" aria-hidden="true"></i><span>${escapeHtml(working ? t("common.loading") : label)}</span>
      </button>`;
    }

    function recoveryMenuMarkup({ label, content, hint = "" }) {
      return `<span class="recovery-popover" role="group" aria-label="${escapeHtml(label)}">
        ${content}
        ${hint ? `<span class="recovery-action-hint">${escapeHtml(hint)}</span>` : ""}
      </span>`;
    }

    function recoveryToggleMarkup({ key, label, checked, data = {} }) {
      const working = state.recoveryActions.has(key);
      const attributes = Object.entries(data)
        .map(([name, value]) => `data-recovery-${escapeHtml(name)}="${escapeHtml(value)}"`)
        .join(" ");
      return `<label class="recovery-toggle">
        <span>${escapeHtml(label)}</span>
        <input class="switch" type="checkbox" data-recovery-toggle="remote-enabled" data-recovery-key="${escapeHtml(key)}" ${attributes} ${checked ? "checked" : ""} ${working ? "disabled aria-busy=\"true\"" : ""}>
      </label>`;
    }

    function agentRuntimeRecovery(item, data) {
      const pluginId = String(item?.plugin_id || "").trim().toLowerCase();
      const desktopAppId = String(item?.desktop_app_id || pluginId.split(".")[0] || "");
      const desktopCard = desktopAppId ? (data.desktop_apps?.[desktopAppId] || null) : null;
      const unavailable = Boolean(
        pluginModeFor(data.config, pluginId) === "desktop" &&
        desktopCard &&
        desktopCard.cdp_reachable === false &&
        desktopCard.managed_status_message
      );
      const managedWorking = state.managedLaunches.has(desktopAppId);
      return {
        unavailable,
        pluginId,
        desktopAppId,
        desktopCard,
        canLaunch: Boolean(item?.managed_launch && desktopCard?.can_launch_managed && !managedWorking),
        managedWorking,
        reason: String(desktopCard?.managed_status_message || ""),
      };
    }

    function recoveryNoticeMarkup({ title, detail, actions }) {
      return `<article class="agent-recovery-notice">
        <div class="agent-recovery-notice-copy"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(detail)}</span></div>
        <div class="agent-recovery-notice-actions">${actions}</div>
      </article>`;
    }

    function renderAgentRecoveryNotices(data) {
      const container = document.getElementById("agent-recovery-notices");
      const list = document.getElementById("agent-recovery-notices-list");
      const toggle = document.getElementById("agent-recovery-notices-toggle");
      if (!container || !list || !toggle) return;
      const notices = [];
      if (!cloudConnectionUsable(data)) {
        const detail = state.browserOnline
          ? (String(data.connection_detail || "").trim() || t("recovery.server_disconnected_detail"))
          : t("recovery.browser_offline_detail");
        notices.push(recoveryNoticeMarkup({
          title: t("recovery.server_disconnected"),
          detail,
          actions: recoveryActionMarkup({
            action: "connection-refresh",
            key: "connection-refresh",
            label: t("action.refresh_connection"),
            icon: "refresh-cw",
          }),
        }));
      }
      for (const item of (data.plugins || []).filter((plugin) => !plugin.error && plugin.plugin_id)) {
        const recovery = agentRuntimeRecovery(item, data);
        if (!recovery.unavailable) continue;
        const name = localPresentation(item, hostPluginFor(recovery.pluginId) || {}).display_name || recovery.pluginId;
        notices.push(recoveryNoticeMarkup({
          title: t("recovery.agent_interrupted", { name }),
          detail: recovery.reason || t("recovery.agent_interrupted_detail", { name }),
          actions: recoveryActionMarkup({
            action: "managed-launch",
            key: `managed-launch:${recovery.desktopAppId}`,
            label: t("agent.managed_relaunch"),
            icon: "app-window",
            disabled: !recovery.canLaunch,
            data: { app: recovery.desktopAppId, plugin: recovery.pluginId },
          }) + recoveryActionMarkup({
            action: "agent-refresh",
            key: `agent-refresh:${recovery.pluginId}`,
            label: t("agent.refresh"),
            icon: "refresh-cw",
            data: { plugin: recovery.pluginId },
          }),
        }));
      }
      if (notices.length > 0 && state.recoveryNoticeCount === 0) {
        state.recoveryNoticesCollapsed = false;
      }
      state.recoveryNoticeCount = notices.length;
      container.hidden = notices.length === 0;
      container.classList.toggle("is-collapsed", state.recoveryNoticesCollapsed);
      document.getElementById("agent-recovery-notice-count").textContent = String(notices.length);
      toggle.setAttribute("aria-expanded", String(!state.recoveryNoticesCollapsed));
      toggle.setAttribute("aria-label", t(state.recoveryNoticesCollapsed ? "recovery.expand" : "recovery.collapse"));
      list.innerHTML = notices.join("");
      renderLucideIcons(container);
      bindRecoveryActions(list);
    }

    function syncServerRecoveryControl(cloudConnected) {
      const control = document.getElementById("server-recovery-control");
      const button = document.getElementById("server-recovery-action");
      if (!control || !button) return;
      const recoverable = !cloudConnected;
      const working = state.recoveryActions.has("connection-refresh");
      control.classList.toggle("is-recoverable", recoverable);
      control.tabIndex = recoverable ? 0 : -1;
      if (!recoverable) delete control.dataset.recoveryDismissed;
      control.setAttribute("aria-label", recoverable ? t("action.refresh_connection") : t("status.connected"));
      button.disabled = working;
      button.dataset.recovering = String(working);
      button.innerHTML = `<i data-lucide="${working ? "loader-circle" : "refresh-cw"}" aria-hidden="true"></i><span>${escapeHtml(working ? t("common.loading") : t("action.refresh_connection"))}</span>`;
      renderLucideIcons(button);
    }

    function refreshRecoveryControls() {
      syncServerRecoveryControl(cloudConnectionUsable());
    }

    async function runRecoveryAction(button, key, action, { successMessage = "", messageElementId = "plugins-message" } = {}) {
      if (!button || button.disabled || state.recoveryActions.has(key)) return;
      state.recoveryActions.add(key);
      refreshRecoveryControls();
      try {
        const result = await action();
        const message = typeof successMessage === "function" ? successMessage(result) : successMessage;
        if (message) showToast(message, "ok");
      } catch (error) {
        setScopedMessage(messageElementId, dashboardRequestMessage(error), "err");
      } finally {
        state.recoveryActions.delete(key);
        refreshRecoveryControls();
      }
    }

    function themeStorageKey() {
      return "prism.dashboard.theme";
    }

    function loadTheme() {
      try {
        const saved = window.localStorage.getItem(themeStorageKey());
        if (saved === "light" || saved === "dark" || saved === "system") return saved;
      } catch {}
      return "system";
    }

    function setTheme(preference) {
      state.themePreference = ["light", "dark", "system"].includes(preference) ? preference : "system";
      state.theme = state.themePreference === "system"
        ? (window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : state.themePreference;
      document.documentElement.dataset.theme = state.theme;
      if (window.parent !== window) {
        window.parent.postMessage({ type: "prism:theme-change", theme: state.theme }, "*");
      }
      document.querySelectorAll("[data-theme-option]").forEach((button) => {
        const active = button.dataset.themeOption === state.themePreference;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      try { window.localStorage.setItem(themeStorageKey(), state.themePreference); }
      catch {}
    }

    function describeHubApply(result) {
      const action = String(result?.action || "");
      if (action === "restart_scheduled" || action === "desktop_restart_scheduled") return t("action.restart_requested");
      if (action === "reloader_watching") return "Hub 正在通过插件重载器应用变更。";
      if (action === "not_required") return t("action.change_saved");
      return "";
    }

    function composeScopedSuccess(base, hubApply) {
      const extra = describeHubApply(hubApply);
      return extra ? `${base} ${extra}` : base;
    }

    function offlineStatusFromLast(reason) {
      requestDesktopHubLifecycle();
      const last = state.lastStatus || {};
      return {
        ...last,
        ok: false,
        checked_at: new Date().toISOString(),
        hub_running: false,
        hub_reachable: false,
        connection_state: "disconnected",
        connection_label: "未连接",
        connection_detail: reason || "当前无法从 Hub 获取最新状态。",
        plugins: Array.isArray(last.plugins) ? last.plugins : [],
        warnings: Array.isArray(last.warnings) ? last.warnings : [],
        account: last.account || {},
        config: last.config || {},
        desktop_apps: last.desktop_apps || {},
      };
    }

    function renderRows(containerId, rows) {
      const element = document.getElementById(containerId);
      if (!element) return;
      element.innerHTML = rows.map((row) => `
        <div class="row">
          <div class="meta">
            <strong>${escapeHtml(row.label)}</strong>
            <span class="mono">${escapeHtml(row.detail)}</span>
          </div>
          ${row.badge || ""}
        </div>
      `).join("");
    }

    function renderWarnings(items) {
      const element = document.getElementById("warnings");
      if (!items || !items.length) {
        element.replaceChildren();
        return;
      }
      element.innerHTML = items.map((item) => `<li>${escapeHtml(item)}</li>`).join("");
    }

    const defaultAgentIconURL = "https://registry.npmmirror.com/@lobehub/icons-static-avatar/latest/files/avatars/codex.webp";

    function validAgentIconURL(value) {
      const candidate = String(value || "").trim();
      if (!candidate || candidate.length > 1024 || /\s/.test(candidate)) return "";
      try {
        const parsed = new URL(candidate);
        return parsed.protocol === "https:" && !parsed.username && !parsed.password ? candidate : "";
      } catch {
        return "";
      }
    }

    function agentIconCandidates(item) {
      const custom = validAgentIconURL(item?.user_icon_url);
      // Official catalog avatars are the default visual identity. They are
      // colourful WebP assets and remain available even when GitHub catalog
      // metadata could not be refreshed. A user override still wins.
      const catalogRaster = validAgentIconURL(item?.catalog_icon_url);
      const raster = validAgentIconURL(item?.manifest_icon_url || item?.icon_url);
      const svg = validAgentIconURL(item?.manifest_icon_svg_url || item?.icon_svg_url);
      // User-owned presentation always wins. Otherwise prefer the coloured
      // catalog avatar, then a declared raster, SVG compatibility fallback,
      // and the fixed Codex avatar. Never guess a URL from plugin_id.
      return [...new Set([custom, catalogRaster, raster, svg, defaultAgentIconURL].filter(Boolean))];
    }

    function agentIconURL(item) {
      return agentIconCandidates(item)[0] || "";
    }

    function advanceAgentIcon(image) {
      let remaining = [];
      try { remaining = JSON.parse(image?.dataset?.iconFallbacks || "[]"); }
      catch {}
      const next = validAgentIconURL(remaining.shift());
      if (next) {
        image.dataset.iconFallbacks = JSON.stringify(remaining);
        image.src = next;
        return;
      }
      image?.closest(".agent-icon")?.classList.remove("has-brand-avatar");
      image?.remove();
    }

    function agentIconMarkup(item) {
      const fallback = '<i class="agent-brand-fallback" data-lucide="bot" aria-hidden="true"></i>';
      const [source, ...remaining] = agentIconCandidates(item);
      if (!source) return fallback;
      return `${fallback}<img class="agent-brand-avatar" src="${escapeHtml(source)}" data-icon-fallbacks="${escapeHtml(JSON.stringify(remaining))}" alt="" aria-hidden="true" onerror="advanceAgentIcon(this)">`;
    }

    function deviceOrigin({ remote = false, name, address, id }) {
      const title = remote ? t("agent.remote_device") : t("agent.local");
      const fallbackName = remote ? t("agent.remote_device") : "本机设备";
      const fallbackAddress = remote ? "地址暂不可用" : "127.0.0.1 · localhost";
      return `<span class="agent-origin device-origin ${remote ? "remote" : ""}" tabindex="0" aria-describedby="${escapeHtml(id)}">
        <i data-lucide="${remote ? "monitor" : "laptop"}" aria-hidden="true"></i>${escapeHtml(title)}
        <span class="device-tooltip" id="${escapeHtml(id)}" role="tooltip">
          <span class="device-tooltip-title">${escapeHtml(title)}</span>
          <span class="device-tooltip-name">${escapeHtml(name || fallbackName)}</span>
          <span class="device-tooltip-address"><i data-lucide="network" aria-hidden="true"></i>${escapeHtml(address || fallbackAddress)}</span>
        </span>
      </span>`;
    }

    function formatUsageReset(millis) {
      const value = Number(millis);
      if (!Number.isFinite(value) || value <= 0) return { date: "", time: "" };
      const locale = String(state.locale || "en-US").replace("_", "-");
      const date = new Date(value);
      // Keep the date independent, while the time stays adjacent to “Reset”.
      try {
        return {
          date: new Intl.DateTimeFormat(locale, {
            month: "short",
            day: "numeric",
          }).format(date),
          time: new Intl.DateTimeFormat(locale, {
            hour: "2-digit",
            minute: "2-digit",
          }).format(date),
        };
      } catch {
        const pad = (x) => String(x).padStart(2, "0");
        return {
          date: `${date.getMonth() + 1}月${date.getDate()}日`,
          time: `${pad(date.getHours())}:${pad(date.getMinutes())}`,
        };
      }
    }

    function localPluginCard(item, data) {
      const pluginId = String(item.plugin_id || "").toLowerCase();
      const desktopAppId = String(item.desktop_app_id || pluginId.split(".")[0] || "");
      const persisted = hostPluginFor(pluginId) || {};
      // Runtime state owns availability; Host metadata owns user-editable
      // presentation such as the display name and product icon.
      const presentation = localPresentation(item, persisted);
      const updateState = String(item.install_state || item.update_state || "").toLowerCase();
      const updateWorking = ["queued", "downloading", "installing", "probing", "activating"].includes(updateState);
      const updateAction = item.update_available ? ` · <button class="agent-inline-update" type="button" data-update-plugin="${escapeHtml(pluginId)}" ${updateWorking ? "disabled" : ""}>${escapeHtml(t(updateWorking ? "agent.updating" : "agent.update"))}</button>` : "";
      const remoteEnabled = Boolean(persisted.plugin_id);
      const desktopCard = desktopAppId ? (data.desktop_apps?.[desktopAppId] || null) : null;
      const managedLaunch = Boolean(item.managed_launch);
      const runtimeModes = pluginRuntimeModes(item);
      const configuredMode = pluginModeFor(data.config, pluginId);
      const runtimeMode = runtimeModes.includes(configuredMode)
        ? configuredMode
        : String(item.current_runtime_mode || item.default_runtime_mode || runtimeModes[0] || configuredMode);
      // CDP is a Desktop-runtime health signal. Native and ACP runtimes can
      // legitimately share a desktop_app_id without requiring that app.
      const runtimeRecovery = agentRuntimeRecovery(item, data);
      const runtimeUnavailable = runtimeRecovery.unavailable;
      const runtimeRecoveryAvailable = runtimeRecovery.canLaunch;
      const runtimeRecoveryReason = runtimeRecovery.reason || "当前无法重新托管此 Agent。";
      const runtimeLabel = t(runtimeUnavailable ? "agent.runtime_unavailable" : "agent.runtime_available");
      const origin = deviceOrigin({
        name: data.local_device_name || data.account?.host_alias || data.account?.host_id,
        address: data.local_device_address || data.hub_url,
        id: `local-device-tooltip-${pluginId}`,
      });
      const runtimeStatus = runtimeUnavailable ? `
        <span class="life-step warning runtime-status recovery-control is-recoverable" tabindex="0">
          <i class="life-icon" data-lucide="circle-x" aria-hidden="true"></i>${runtimeLabel}
          ${recoveryMenuMarkup({
            label: runtimeLabel,
            hint: runtimeRecoveryAvailable ? "" : runtimeRecoveryReason,
            content: recoveryActionMarkup({
              action: "managed-launch",
              key: `managed-launch:${desktopAppId}`,
              label: t("agent.managed_relaunch"),
              icon: "app-window",
              disabled: !runtimeRecoveryAvailable,
              data: { app: desktopAppId, plugin: pluginId },
            }) + recoveryActionMarkup({
              action: "agent-refresh",
              key: `agent-refresh:${pluginId}`,
              label: t("agent.refresh"),
              icon: "refresh-cw",
              data: { plugin: pluginId },
            }),
          })}
        </span>
      ` : `<span class="life-step"><i class="life-icon" data-lucide="cpu" aria-hidden="true"></i>${runtimeLabel}</span>`;
      const managedAction = runtimeMode === "desktop" && managedLaunch && desktopCard ? `
        <button class="menu-action" type="button" data-launch-desktop="${escapeHtml(desktopAppId)}" ${desktopCard.can_launch_managed && !runtimeRecovery.managedWorking ? "" : "disabled"} ${runtimeRecovery.managedWorking ? 'aria-busy="true"' : ""}>
          <i data-lucide="${runtimeRecovery.managedWorking ? "loader-circle" : "app-window"}" aria-hidden="true"></i>
          <strong>${runtimeRecovery.managedWorking ? escapeHtml(t("agent.managed_starting", { name: desktopCard.display_name || desktopAppId })) : escapeHtml(t(desktopCard.launch_action_label === "启动" ? "agent.managed_launch" : "agent.managed_relaunch"))}</strong>
        </button>
      ` : "";
      const managedTerminalAction = item.can_open_managed_terminal ? `
        <button class="menu-action" type="button" data-open-managed-terminal="${escapeHtml(pluginId)}">
          <i data-lucide="terminal" aria-hidden="true"></i>
          <strong>打开托管终端</strong>
        </button>
      ` : "";
      const remoteLifecycleStep = remoteEnabled ? `
        <span class="life-step"><i class="life-icon" data-lucide="cloud-check" aria-hidden="true"></i>${t("agent.remote_enabled")}</span>
      ` : `
        <span class="life-step warning recovery-control is-recoverable" tabindex="0">
          <i class="life-icon" data-lucide="cloud-check" aria-hidden="true"></i>${t("agent.remote_disabled")}
          ${recoveryMenuMarkup({
            label: t("agent.enable_remote"),
            content: recoveryToggleMarkup({
              key: `remote-enable:${pluginId}`,
              label: t("agent.enable_remote"),
              checked: false,
              data: { plugin: pluginId },
            }),
          })}
        </span>
      `;
      const lifecycle = runtimeUnavailable ? `
        <div class="lifecycle lifecycle-recovery">
          ${runtimeStatus}<i class="life-arrow" data-lucide="chevron-right" aria-hidden="true"></i>
          ${remoteLifecycleStep}
        </div>
      ` : `
        <div class="lifecycle">
          <span class="life-step"><i class="life-icon" data-lucide="cpu" aria-hidden="true"></i>${runtimeLabel}</span><i class="life-arrow" data-lucide="chevron-right" aria-hidden="true"></i>
          ${remoteLifecycleStep}
        </div>
      `;
      const agentUsage = desktopCard && desktopCard.agent_usage ? desktopCard.agent_usage : null;
      const fiveHour = agentUsage && agentUsage.five_hour ? agentUsage.five_hour : null;
      const weekly = agentUsage && agentUsage.weekly ? agentUsage.weekly : null;
      // App Server reports usedPercent (consumed). The card surfaces REMAINING,
      // matching the Codex Desktop readout: a depleting bar in a neutral dark
      // fill that visually shrinks as each quota window runs out.
      const usageRow = (window, remainingLabel) => {
        if (!window) return "";
        const used = Math.max(0, Math.min(100, Math.round(Number(window.used_percent) || 0)));
        const remaining = 100 - used;
        const resetAt = formatUsageReset(window.resets_at);
        return `
        <div class="agent-usage-row">
          <span class="agent-usage-label">${t(remainingLabel)}</span>
          <span class="agent-usage-percent">${remaining}%</span>
          <div class="agent-usage-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${remaining}" aria-label="${escapeHtml(t(remainingLabel))}">
            <span class="agent-usage-bar-fill" style="width:${remaining}%"></span>
          </div>
          <span class="agent-usage-reset-date">${escapeHtml(resetAt.date)}</span>
          <span class="agent-usage-reset-time">${escapeHtml(resetAt.time)}</span>
          <span class="agent-usage-reset">${escapeHtml(t("agent.usage_reset"))}</span>
        </div>
        `;
      };
      const usageRows = fiveHour || weekly ? `
        <div class="agent-usage-list">
          ${usageRow(fiveHour, "agent.five_hour_remaining")}
          ${usageRow(weekly, "agent.weekly_remaining")}
        </div>
      ` : "";
      return `
        <article class="agent-card" data-agent-card="${escapeHtml(pluginId)}">
          <div class="agent-summary">
            <div class="agent-head">
              <div class="agent-identity">
                <div class="agent-icon${agentIconURL(presentation) ? " has-brand-avatar" : ""}">${agentIconMarkup(presentation)}</div>
                <div class="agent-name">
                  <div class="agent-name-line">
                    <strong>${escapeHtml(presentation.display_name || pluginId)}</strong>
                    ${origin}
                  </div>
                  <span>${escapeHtml(pluginId)} · v${escapeHtml(item.version || "-")} · ${escapeHtml(runtimeMode || "-")}${updateAction}</span>
                </div>
              </div>
              <button class="more-button" type="button" data-agent-menu="${escapeHtml(pluginId)}" aria-label="${escapeHtml(t("agent.open_actions", { name: presentation.display_name || pluginId }))}"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
            </div>
            ${lifecycle}
            ${usageRows}
          </div>
          <div class="agent-details">
            <div class="agent-details-header">${t("agent.menu_title")}</div>

    function renderPluginCards(data) {
      const element = document.getElementById("plugin-local-grid");
      const renderedOpenMenuId = state.openAgentMenuId || element.querySelector(".agent-card.expanded")?.dataset.agentCard || null;
      const plugins = (data.plugins || []).filter((item) => !item.error && item.plugin_id);
      const localPluginIDs = new Set(plugins.map((item) => String(item.plugin_id || "").trim().toLowerCase()));
      const localHostID = String(data.account?.host_id || state.lastHostPlugins?.host_id || "").trim();
      const remotePlugins = hostPlugins().filter((item) => {
        const pluginId = String(item.plugin_id || "").trim().toLowerCase();
        const hostId = String(item.host_id || state.lastHostPlugins?.host_id || "").trim();
        return pluginId && hostId && hostId !== localHostID && !localPluginIDs.has(pluginId);
      });
      const allAgents = plugins.length + remotePlugins.length;
      const noAgents = allAgents === 0;
      const pluginManagerButton = document.getElementById("plugin-manager-open-btn");
      const emptyIllustration = document.getElementById("agent-empty-illustration");
      document.getElementById("agent-count").textContent = String(allAgents);
      document.getElementById("metric-plugins").textContent = String(allAgents);
      document.getElementById("metric-plugins-detail").textContent =
        `${remotePlugins.length} 个远程设备 Agent`;
      element.classList.toggle("agent-list-empty", noAgents);
      pluginManagerButton.classList.toggle("needs-plugin", noAgents);
      emptyIllustration.hidden = !noAgents;
      element.innerHTML = allAgents
        ? [...plugins.map((item) => localPluginCard(item, data)), ...remotePlugins.map((item) => remotePluginCard(item, data))].join("")
        : "";
      renderLucideIcons(element);
      bindRecoveryActions(element);
      const restoredOpenCard = renderedOpenMenuId
        ? [...element.querySelectorAll(".agent-card")].find((card) => card.dataset.agentCard === renderedOpenMenuId)
        : null;
      state.openAgentMenuId = restoredOpenCard ? renderedOpenMenuId : null;
      restoredOpenCard?.classList.add("expanded");

      document.querySelectorAll("[data-agent-menu]").forEach((button) => {
        const card = button.closest(".agent-card");
        const details = card?.querySelector(".agent-details");
        if (!card || !details) return;

        const openMenu = () => {
          if (closeTimer) window.clearTimeout(closeTimer);
          document.querySelectorAll(".agent-card.expanded").forEach((item) => {
            if (item !== card) item.classList.remove("expanded");
          });
          state.openAgentMenuId = card.dataset.agentCard || null;
          card.classList.add("expanded");
        };
        const closeMenu = () => {
          card.classList.remove("expanded");
          if (state.openAgentMenuId === card.dataset.agentCard) state.openAgentMenuId = null;
        };
        let closeTimer = null;
        const scheduleClose = () => {
          if (closeTimer) window.clearTimeout(closeTimer);
          closeTimer = window.setTimeout(() => {
            if (!button.matches(":hover") && !details.matches(":hover")) closeMenu();
          }, 160);
        };

        button.addEventListener("pointerenter", openMenu);
        details.addEventListener("pointerenter", openMenu);
        button.addEventListener("pointerleave", scheduleClose);
        details.addEventListener("pointerleave", scheduleClose);
        button.addEventListener("focus", openMenu);
        button.addEventListener("click", openMenu);
        card.addEventListener("focusout", (event) => {
          const nextTarget = event.relatedTarget;
          if (!nextTarget || (!button.contains(nextTarget) && !details.contains(nextTarget))) scheduleClose();
        });
      });
      document.querySelectorAll("[data-refresh-agent]").forEach((button) => {
        button.addEventListener("click", () => runDashboardAction("plugins-message", async () => {
          await refreshAll();
          showToast(`${t("agent.refresh")}：${pluginDisplayName(button.dataset.refreshAgent)}`, "ok");
        }));
      });
      document.querySelectorAll("[data-edit-agent]").forEach((button) => {
        button.addEventListener("click", () => openAgentMetadataEditor(button.dataset.editAgent));
      });
      document.querySelectorAll("[data-local-remote-enabled], [data-remote-enabled]").forEach((toggle) => {
        toggle.addEventListener("change", () => updateLocalRemoteEnabled(toggle));
      });
      document.querySelectorAll("[data-launch-desktop]").forEach((button) => {
        button.addEventListener("click", () => runDashboardAction("plugins-message", () => launchDesktopApp(button.dataset.launchDesktop)));
      });
      document.querySelectorAll("[data-open-managed-terminal]").forEach((button) => {
        button.addEventListener("click", () => runDashboardAction("plugins-message", () => openManagedTerminal(button.dataset.openManagedTerminal)));
      });
      document.querySelectorAll("[data-remove-plugin]").forEach((button) => {
        button.addEventListener("click", () => runDashboardAction("plugins-message", () => removePlugin(button.dataset.removePlugin)));
      });
      document.querySelectorAll("[data-update-plugin]").forEach((button) => {
        button.addEventListener("click", () => runDashboardAction("plugins-message", () => updateCatalogPlugin(button.dataset.updatePlugin)));
      });
      document.querySelectorAll("[data-plugin-runtime-mode]").forEach((button) => {
        button.addEventListener("click", () => runDashboardAction("plugins-message", () =>
          savePluginRuntimeMode(button.dataset.pluginRuntimeMode, button.dataset.runtimeModeValue)));
      });
    }

    function statusRenderFingerprint(data) {
      const { checked_at: _checkedAt, ...stable } = data || {};
      return JSON.stringify(stable);
    }

    function applyStatus(data, { force = false } = {}) {
      state.lastStatus = data;
      const fingerprint = statusRenderFingerprint(data);
      if (!force && fingerprint === state.statusRenderFingerprint) return;
      state.statusRenderFingerprint = fingerprint;
      const loginReady = Boolean(data.logged_in);
      const accountName = data.account?.name || data.account?.account_id || "Prism 用户";
      const hostName = data.account?.host_alias || data.account?.host_id || "本机 Host";
      const hostId = data.account?.host_id || "-";
      const initials = initialsForAccount(accountName);
      const plugins = (data.plugins || []).filter((item) => !item.error);
      const remoteCount = plugins.filter((item) => Boolean(hostPluginFor(item.plugin_id))).length;

      document.getElementById("account-avatar").textContent = initials;
      document.getElementById("account-trigger-name").textContent = loginReady ? accountName : "账户";
      document.getElementById("account-name").textContent = loginReady ? accountName : t("status.logged_out");
      document.getElementById("host-name").textContent = hostName;
      document.getElementById("drawer-host-name").textContent = hostName;
      document.getElementById("drawer-host-id").textContent = hostId;
      document.getElementById("host-meta").textContent =
        `${navigator.platform || "Desktop"} · ${hostId} · ${data.region || "-"}`;
      document.getElementById("login-host-alias").value = hostName === "本机 Host" ? "" : hostName;

      const hubStatus = document.getElementById("hub-status");
      const desktopLifecycle = String(state.desktopHubLifecycle || "").toLowerCase();
      const hubState = data.hub_running
        ? "running"
        : (desktopLifecycle === "starting" ? "starting" : "not_running");
      const hubLabel = hubState === "running"
        ? t("status.running")
        : (hubState === "starting" ? t("status.starting") : t("status.not_running"));
      hubStatus.classList.toggle("offline", hubState === "not_running");
      hubStatus.querySelector("span").textContent = hubLabel;
      document.getElementById("hub-value").textContent = hubLabel;
      const connectionLabel = cloudConnectionLabel(data);
      document.getElementById("server-value").textContent = connectionLabel;
      const hostPluginSync = hostPluginSyncPresentation(data);
      document.getElementById("host-plugin-sync-value").textContent = hostPluginSync.label;
      document.getElementById("host-plugin-sync-control").title = data.host_plugin_sync_detail || hostPluginSync.label;
      syncServerRecoveryControl(cloudConnectionUsable(data));
      for (const id of ["hub-icon", "server-icon", "host-plugin-sync-icon"]) {
        const icon = document.getElementById(id);
        const healthy = id === "hub-icon"
          ? data.hub_running
          : (id === "server-icon" ? cloudConnectionUsable(data) : hostPluginSync.healthy);
        icon.classList.toggle("warning", !healthy);
      }

      document.getElementById("checked-at").textContent = data.checked_at || "-";
      document.getElementById("metric-region").textContent = data.region || "-";
      document.getElementById("metric-connection").textContent = connectionLabel;
      document.getElementById("metric-connection-detail").textContent = state.browserOnline
        ? (data.connection_detail || "-")
        : "当前设备网络不可用。";
      document.getElementById("metric-login").textContent = loginReady ? t("status.logged_in") : t("status.logged_out");
      document.getElementById("metric-login-detail").textContent = hostName;
      document.getElementById("hub-side-text").textContent = connectionLabel;
      document.getElementById("login-side-text").textContent = loginReady ? t("status.logged_in") : t("status.logged_out");
      document.getElementById("hub-restart-btn").disabled = !data.hub_running;
      document.getElementById("account-logout-btn").style.display = loginReady ? "" : "none";
      renderWarnings(data.warnings || []);
      renderAgentRecoveryNotices(data);
      renderDoctorSummary(data);
      renderPluginCards(data);

      const authenticationStillRequired = ["auth_expired", "unauthorized"].includes(String(data.connection_state || "").toLowerCase());
      if (state.loginTransition && !state.awaitingHubRestart && (cloudConnectionActive(data) || authenticationStillRequired)) {
        finishLoginTransition();
      }
      // A doctor-degraded status (for example a broken config) must keep the
      // dashboard visible so the diagnostics panel stays reachable.
      const degraded = doctorStatusDegraded(data);
      if (!state.loginTransition && (!loginReady || state.reauthRequired || authenticationStillRequired) && !degraded && state.page !== "login") switchPage("login");
      if (loginReady && !state.reauthRequired && !authenticationStillRequired && state.page === "login" && !degraded) switchPage("dashboard");
      document.getElementById("plugin-local-summary").textContent = `${remoteCount} / ${plugins.length}`;
    }

    async function loadStatus({ force = false } = {}) {
      const authRevision = state.authRevision;
      try {
        const response = await fetch(force ? "/api/status?refresh=1" : "/api/status", { cache: "no-store" });
        const data = await response.json();
        // A doctor-degraded payload (for example a broken config) is still a
        // live Hub answer; only a hard failure falls back to the offline view.
        const degraded = doctorStatusDegraded(data);
        if (!response.ok || (!data.ok && !degraded)) throw new Error(data.error || "Hub 状态读取失败");
        if (authRevision === state.authRevision) applyStatus(data);
        return data;
      } catch (error) {
        if (authRevision === state.authRevision) applyStatus(offlineStatusFromLast(error?.message || String(error)));
        throw error;
      }
    }

    function requestDesktopHubLifecycle() {
      if (window.parent === window) return;
      window.parent.postMessage({ type: "prism:hub-lifecycle-status-request" }, "*");
    }

    async function loadHostPlugins({ force = false } = {}) {
      const authRevision = state.authRevision;
      if (!state.lastStatus?.remote_control_ready) {
        state.lastHostPlugins = null;
        state.lastHostPluginsAt = 0;
        if (state.lastStatus) applyStatus(state.lastStatus, { force: true });
        return;
      }
      if (!force && state.lastHostPlugins && Date.now() - state.lastHostPluginsAt < 60_000) return;
      try {
        const response = await fetch("/api/host/plugins", { cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (authRevision !== state.authRevision) return;
        if (data.action === "reauth_required") {
          state.lastHostPlugins = null;
          state.reauthRequired = true;
          switchPage("login");
          setScopedMessage("login-message", data.message || "登录凭证已失效，请重新登录以恢复服务器连接。", "err");
          return;
        }
        if (!response.ok || !data.ok) throw new Error(data.error || "加载远程 Agent 失败");
        state.lastHostPlugins = data;
        state.lastHostPluginsAt = Date.now();
        if (state.lastStatus) applyStatus(state.lastStatus, { force: true });
      } catch (error) {
        if (authRevision !== state.authRevision) return;
        state.lastHostPlugins = null;
        state.lastHostPluginsAt = 0;
        setScopedMessage("plugins-message", dashboardRequestMessage(error), "err");
        if (state.lastStatus) applyStatus(state.lastStatus, { force: true });
      }
    }

    async function refreshAll({ automatic = false, forceStatus = false } = {}) {
      if (state.refreshInFlight) return state.refreshInFlight;
      state.refreshInFlight = (async () => {
        await loadStatus({ force: forceStatus || !automatic });
        await loadHostPlugins({ force: !automatic });
        // Reports change independently of the main status fingerprint.
        // A diagnostics fetch failure must not mark a healthy Hub offline.
        if (state.doctorPanelOpen && !state.doctorRunning) {
          await loadDoctorReport().catch(() => {});
        }
      })().finally(() => { state.refreshInFlight = null; });
      return state.refreshInFlight;
    }

    function pluginCatalogIcon(item) {
      const [source, ...remaining] = agentIconCandidates(item);
      return `<i class="agent-brand-fallback" data-lucide="bot" aria-hidden="true"></i><img src="${escapeHtml(source)}" data-icon-fallbacks="${escapeHtml(JSON.stringify(remaining))}" alt="" aria-hidden="true" onerror="advanceAgentIcon(this)">`;
    }

    function pluginCatalogCard(item, installed) {
      const pluginId = String(item?.plugin_id || "").trim();
      const displayName = String(item?.display_name || pluginId || "插件").trim();
      const operation = state.pluginCatalogOperations.get(pluginId);
      const operationState = String(operation?.state || item?.install_state || "").toLowerCase();
      const working = ["queued", "downloading", "installing", "probing", "activating"].includes(operationState);
      const compatible = item?.compatible !== false;
      const supported = item?.supported !== false;
      let statusKey = installed ? "agent.installed" : "agent.not_installed";
      let action = "";
      if (working) {
        const isDownloading = operationState === "downloading";
        const downloaded = Number(operation?.downloaded_bytes || 0);
        const total = Number(operation?.download_total_bytes || 0);
        const percent = total > 0 ? Math.max(0, Math.min(100, Math.round((downloaded / total) * 100))) : null;
        const label = t(isDownloading ? "agent.downloading" : (installed ? "agent.updating" : "agent.installing"));
        const ring = isDownloading && percent !== null
          ? `<span class="plugin-catalog-progress-ring" style="--progress:${percent}" aria-hidden="true"><b>${percent}%</b></span>`
          : "";
        action = `<span class="plugin-catalog-progress" role="status" aria-label="${escapeHtml(percent === null ? label : `${label} ${percent}%`)}">${ring}<span>${escapeHtml(label)}</span></span>`;
      } else if (!supported) {
        statusKey = "agent.unsupported_platform";
      } else if (!compatible) {
        statusKey = "agent.requires_hub_update";
      } else if (installed && item?.update_available) {
        action = `<button class="plugin-catalog-action" type="button" data-catalog-update-plugin="${escapeHtml(pluginId)}"><i data-lucide="download" aria-hidden="true"></i>${escapeHtml(t("agent.update"))}</button>`;
      } else if (installed) {
        action = `<button class="plugin-catalog-action danger" type="button" data-catalog-remove-plugin="${escapeHtml(pluginId)}"><i data-lucide="trash-2" aria-hidden="true"></i>${escapeHtml(t("agent.uninstall_short"))}</button>`;
      } else {
        action = `<button class="plugin-catalog-action" type="button" data-catalog-install-plugin="${escapeHtml(pluginId)}"><i data-lucide="download" aria-hidden="true"></i>${escapeHtml(t("agent.install"))}</button>`;
      }
      return `<article class="plugin-catalog-card" title="${escapeHtml(item?.description || displayName)}">
        <div class="plugin-catalog-icon">${pluginCatalogIcon(item)}</div>
        <strong class="plugin-catalog-name">${escapeHtml(displayName)}</strong>
        ${working ? "" : `<span class="plugin-catalog-status ${installed ? "installed" : "available"}">${escapeHtml(t(statusKey))}</span>`}
        ${action}
      </article>`;
    }

    function renderPluginCatalog(catalog = state.pluginCatalog) {
      const libraryGrid = document.getElementById("plugin-library-grid");
      if (!libraryGrid) return;
      const installed = Array.isArray(catalog?.installed) ? catalog.installed.filter((item) => item?.plugin_id && !item?.error) : [];
      const library = Array.isArray(catalog?.library) ? catalog.library.filter((item) => item?.plugin_id) : [];
      const plugins = [
        ...installed.map((item) => ({ ...item, installed: true })),
        ...library.map((item) => ({ ...item, installed: false })),
      ].sort((left, right) => String(left.display_name || left.plugin_id).localeCompare(
        String(right.display_name || right.plugin_id), state.locale,
      ));
      libraryGrid.innerHTML = plugins.length
        ? plugins.map((item) => pluginCatalogCard(item, item.installed)).join("")
        : `<div class="plugin-catalog-empty">${escapeHtml(t("agent.no_manageable_plugins"))}</div>`;
      renderLucideIcons(document.getElementById("plugin-manager-overlay"));
      document.querySelectorAll("[data-catalog-install-plugin]").forEach((button) => {
        button.addEventListener("click", () => runDashboardAction("plugins-message", () => installCatalogPlugin(button.dataset.catalogInstallPlugin)));
      });
      document.querySelectorAll("[data-catalog-remove-plugin]").forEach((button) => {
        button.addEventListener("click", () => runDashboardAction("plugins-message", () => removePlugin(button.dataset.catalogRemovePlugin)));
      });
      document.querySelectorAll("[data-catalog-update-plugin]").forEach((button) => {
        button.addEventListener("click", () => runDashboardAction("plugins-message", () => updateCatalogPlugin(button.dataset.catalogUpdatePlugin)));
      });
    }

    async function loadPluginCatalog() {
      const response = await fetch("/api/plugins/catalog", { cache: "no-store" });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.error || t("agent.load_local_plugins_failed"));
      state.pluginCatalog = data;
      renderPluginCatalog(data);
      return data;
    }

    async function refreshPluginLibrary({ notify = true } = {}) {
      const refreshButton = document.getElementById("refresh-plugin-library-btn");
      if (refreshButton) refreshButton.disabled = true;
      try {
        if (notify) {
          const response = await fetch("/api/plugins/catalog/refresh", { method: "POST" });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.ok) throw new Error(data.error || t("agent.load_local_plugins_failed"));
        }
        await refreshAll();
        await loadPluginCatalog();
        if (notify) showToast(t("agent.local_plugins_refreshed"), "ok");
      } finally {
        if (refreshButton) refreshButton.disabled = false;
      }
    }

    function openPluginManager() {
      const overlay = document.getElementById("plugin-manager-overlay");
      state.pluginManagerPreviousFocus = document.activeElement;
      overlay.hidden = false;
      overlay.setAttribute("aria-hidden", "false");
      loadPluginCatalog().catch((error) => setScopedMessage("plugins-message", dashboardRequestMessage(error), "err"));
      window.setTimeout(() => document.getElementById("plugin-manager-close-btn")?.focus(), 0);
    }

    function closePluginManager() {
      const overlay = document.getElementById("plugin-manager-overlay");
      overlay.hidden = true;
      overlay.setAttribute("aria-hidden", "true");
      state.pluginManagerPreviousFocus?.focus?.();
      state.pluginManagerPreviousFocus = null;
    }

    function doctorStatusDegraded(data) {
      return Boolean(data && !data.ok && data.doctor && Number(data.doctor.open_findings || 0) > 0);
    }

    function doctorFindingIcon(severity) {
      switch (String(severity || "").toLowerCase()) {
        case "critical": return "octagon-alert";
        case "warning": return "triangle-alert";
        default: return "info";
      }
    }

    function doctorFormatTime(value) {
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return "-";
      return parsed.toLocaleString(state.locale || "zh-CN", { hour12: false });
    }

    // Raw per-sweep occurrence counts read as noise; surface how long the
    // anomaly has been open instead (the backend counter stays for M2).
    function doctorDurationLabel(from) {
      const start = new Date(from).getTime();
      if (Number.isNaN(start)) return "";
      const minutes = Math.max(1, Math.floor((Date.now() - start) / 60000));
      if (minutes < 60) return t("doctor.duration_minutes", { count: String(minutes) });
      const hours = Math.floor(minutes / 60);
      if (hours < 48) return t("doctor.duration_hours", { count: String(hours) });
      return t("doctor.duration_days", { count: String(Math.floor(hours / 24)) });
    }

    function doctorFindingMeta(finding) {
      const first = t("doctor.first_detected", { time: doctorFormatTime(finding.detected_at) });
      const duration = doctorDurationLabel(finding.detected_at);
      return duration ? `${first} · ${duration}` : first;
    }

    function renderDoctorSummary(data) {
      const doctor = data?.doctor;
      maybeToastAutoHeal(doctor);
      const openFindings = Number(doctor?.open_findings || 0);
      const hasFindings = Boolean(doctor) && openFindings > 0;
      const entry = document.getElementById("doctor-open-btn");
      const badge = document.getElementById("doctor-entry-badge");
      const drawerCount = document.getElementById("doctor-drawer-count");
      if (entry) {
        entry.hidden = !hasFindings;
        entry.classList.toggle("attention", Number(doctor?.requires_confirmation || 0) > 0);
      }
      if (badge) {
        badge.hidden = !hasFindings;
        if (hasFindings) badge.textContent = String(openFindings);
      }
      if (drawerCount) {
        drawerCount.hidden = !hasFindings;
        if (hasFindings) drawerCount.textContent = t("doctor.pending_count", { count: String(openFindings) });
      }
      if (state.doctorPanelOpen && state.lastDoctorReport && !state.doctorRunning) renderDoctorReport(state.lastDoctorReport);
    }

    function renderDoctorReport(report) {
      const meta = document.getElementById("doctor-meta");
      const findingsList = document.getElementById("doctor-findings-list");
      const findingsCount = document.getElementById("doctor-findings-count");
      const checksList = document.getElementById("doctor-checks-list");
      if (!meta || !findingsList || !checksList) return;
      const findings = (report?.findings || []);
      const stateLabel = report?.state === "ok"
        ? t("doctor.state_ok")
        : t("doctor.state_findings", { count: String(findings.length) });
      const lastRunAt = Math.max(0, ...(report?.checks || []).map((check) => {
        const at = new Date(check.last_run_at).getTime();
        return Number.isFinite(at) && at > 0 ? at : 0;
      }));
      const lastRun = lastRunAt
        ? t("doctor.last_run", { time: doctorFormatTime(lastRunAt) })
        : t("doctor.never_run");
      meta.innerHTML = `<strong class="doctor-meta-state ${escapeHtml(String(report?.state || "ok"))}">${escapeHtml(stateLabel)}</strong><span>·</span><span>${escapeHtml(lastRun)}</span>`;
      if (findingsCount) findingsCount.textContent = findings.length ? String(findings.length) : "";
      findingsList.innerHTML = findings.length
        ? findings.map((finding) => {
          const params = {};
          Object.entries(finding.summary_params || {}).forEach(([key, value]) => { params[key] = String(value); });
          const summary = t(String(finding.summary_i18n || "doctor.unknown_finding"), params);
          const hintParams = {};
          Object.entries(finding.hint_params || {}).forEach(([key, value]) => { hintParams[key] = String(value); });
          const hint = finding.hint_i18n
            ? `<div class="doctor-finding-hint">${escapeHtml(t(String(finding.hint_i18n), hintParams))}</div>`
            : "";
          const meta2 = finding.detected_at
            ? `<div class="doctor-finding-meta">${escapeHtml(doctorFindingMeta(finding))}</div>`
            : "";
          const detail = finding.detail
            ? `<div class="doctor-finding-detail">${escapeHtml(String(finding.detail))}</div>`
            : "";
          const escalatedBadge = finding.escalated
            ? `<span class="doctor-escalated-badge">${escapeHtml(t("doctor.escalated"))}</span>`
            : "";
          const remedyButtons = (finding.remedies || [])
            .filter((remedy) => remedy.available)
            .map((remedy) => {
              const title = t(String(remedy.title_i18n || "doctor.remedy_run"));
              return `<button class="doctor-remedy-button${remedy.risk === "confirm" ? " danger" : ""}" type="button"
                data-doctor-finding="${escapeHtml(finding.id)}" data-doctor-remedy="${escapeHtml(remedy.id)}">
                <i data-lucide="${remedy.risk === "confirm" ? "shield-alert" : "wand-sparkles"}" aria-hidden="true"></i>
                <span>${escapeHtml(title)}</span>
              </button>`;
            }).join("");
          const dismissButton = `<button class="doctor-dismiss-button" type="button" data-doctor-dismiss="${escapeHtml(finding.id)}">${escapeHtml(t("doctor.dismiss"))}</button>`;
          const actions = (remedyButtons || dismissButton)
            ? `<div class="doctor-finding-actions">${remedyButtons}${dismissButton}</div>`
            : "";
          return `<div class="doctor-finding ${escapeHtml(String(finding.severity || "info"))}">
            <div class="doctor-finding-head"><i data-lucide="${doctorFindingIcon(finding.severity)}" aria-hidden="true"></i><span>${escapeHtml(summary)}</span>${escalatedBadge}</div>
            ${meta2}${hint}${detail}${actions}
          </div>`;
        }).join("")
        : `<div class="doctor-finding-meta">${escapeHtml(t("doctor.no_findings"))}</div>`;
      bindDoctorFindingActions();
      checksList.innerHTML = (report?.checks || []).map((check) => {
        const label = t(`doctor.check.${String(check.id || "")}`);
        let dotClass = "ok";
        let value = "";
        if (check.last_error) {
          dotClass = "error";
          value = t("doctor.check_error");
        } else if (Number(check.open_findings || 0) > 0) {
          dotClass = "findings";
          value = t("doctor.open_findings_count", { count: String(check.open_findings) });
        } else if (!check.last_run_at) {
          dotClass = "idle";
          value = t("doctor.never_run");
        }
        return `<div class="doctor-check-row">
          <span class="doctor-check-name"><span class="doctor-check-dot ${dotClass}"></span>${escapeHtml(label)}</span>
          <span class="doctor-check-value">${escapeHtml(value)}</span>
        </div>`;
      }).join("");
      renderLucideIcons(document.getElementById("doctor-overlay"));
    }

    async function loadDoctorReport({ fresh = false } = {}) {
      if (fresh) {
        state.doctorReportRevision++;
        await state.doctorReportInFlight?.catch(() => {});
      }
      if (state.doctorReportInFlight) return state.doctorReportInFlight;
      const revision = state.doctorReportRevision;
      state.doctorReportInFlight = (async () => {
        const response = await fetch("/api/doctor/report", { cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || t("doctor.load_failed"));
        // A report requested before a manual check must not overwrite its result.
        if (revision === state.doctorReportRevision && !state.doctorRunning) {
          state.lastDoctorReport = data.doctor;
          renderDoctorReport(data.doctor);
          loadDoctorHistory().catch(() => {});
        }
        return data.doctor;
      })().finally(() => { state.doctorReportInFlight = null; });
      return state.doctorReportInFlight;
    }

    function doctorHistoryLabel(event) {
      const trigger = { auto: "doctor.history_auto", manual: "doctor.history_manual", dismiss: "doctor.history_dismissed", system: "doctor.history_system" }[String(event.trigger || "")] || "";
      const result = { success: "doctor.history_success", failed: "doctor.history_failed", rejected: "doctor.history_rejected", escalated: "doctor.history_escalated" }[String(event.result || "")] || "";
      const parts = [trigger, result].filter(Boolean).map((key) => t(key));
      return parts.join(" · ");
    }

    async function loadDoctorHistory() {
      const list = document.getElementById("doctor-history-list");
      if (!list) return;
      const response = await fetch("/api/doctor/history?limit=10", { cache: "no-store" });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) return;
      const events = data.events || [];
      list.innerHTML = events.length
        ? events.map((event) => {
          const failed = event.result === "failed";
          return `<div class="doctor-history-row${failed ? " failed" : ""}">
            <span class="doctor-history-label">${escapeHtml(doctorHistoryLabel(event))}</span>
            <span class="doctor-history-meta">${escapeHtml(doctorFormatTime(event.at))}${event.error ? ` · ${escapeHtml(String(event.error))}` : ""}</span>
          </div>`;
        }).join("")
        : `<div class="doctor-finding-meta">${escapeHtml(t("doctor.history_empty"))}</div>`;
    }

    async function runDoctorChecks() {
      if (state.doctorRunning) return;
      state.doctorRunning = true;
      state.doctorReportRevision++;
      const runButton = document.getElementById("doctor-run-btn");
      if (runButton) runButton.disabled = true;
      const meta = document.getElementById("doctor-meta");
      if (meta) meta.innerHTML = `<strong class="doctor-meta-state">${escapeHtml(t("doctor.running"))}</strong>`;
      try {
        const response = await fetch("/api/doctor/run", { method: "POST" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || t("doctor.load_failed"));
        state.lastDoctorReport = data.doctor;
        renderDoctorReport(data.doctor);
        loadDoctorHistory().catch(() => {});
        await refreshAll({ automatic: true }).catch(() => {});
        showToast(t("doctor.run_complete"), "ok");
      } catch (error) {
        showToast(dashboardRequestMessage(error), "err");
        if (state.lastDoctorReport) renderDoctorReport(state.lastDoctorReport);

        state.doctorRunning = false;

    async function postDoctorFindingAction(findingID, remedyID, confirmed) {
      const suffix = remedyID ? `/remedies/${encodeURIComponent(remedyID)}` : "/dismiss";
      const response = await fetch(`/api/doctor/findings/${encodeURIComponent(findingID)}${suffix}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: remedyID ? JSON.stringify({ confirmed }) : undefined,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.error || t("doctor.load_failed"));
      return data;
    }

    // One-click fix. Confirm-class remedies show the impact statement first
    // (docs/15 §2.1); transparent remedies run immediately.
    async function runDoctorRemedy(findingID, remedyID) {
      const finding = doctorFindingById(findingID);
      const remedy = (finding?.remedies || []).find((item) => item.id === remedyID);
      if (!remedy) return;
      if (remedy.risk === "confirm") {
        const impactParams = {};
        Object.entries(remedy.impact_params || {}).forEach(([key, value]) => { impactParams[key] = String(value); });
        const impact = remedy.impact_i18n ? t(String(remedy.impact_i18n), impactParams) : t("doctor.impact_default");
        const title = t(String(remedy.title_i18n || "doctor.remedy_run"));
        const accepted = await requestDashboardConfirmation(impact, {
          title: t("doctor.confirm_title"),
          confirmText: title,
          tone: "danger",
        });
        if (!accepted) return;
      }
      await runDashboardAction("plugins-message", async () => {
        try {
          await postDoctorFindingAction(findingID, remedyID, true);
          showToast(t("doctor.remedy_applied"), "ok");
        } catch (error) {
          showToast(dashboardRequestMessage(error), "err");
        }
        await loadDoctorReport({ fresh: true });
        await refreshAll({ automatic: true });
      });
    }

    async function dismissDoctorFinding(findingID) {
      await runDashboardAction("plugins-message", async () => {
        try {
          await postDoctorFindingAction(findingID, null, false);
        } catch (error) {
          showToast(dashboardRequestMessage(error), "err");
        }
        await loadDoctorReport({ fresh: true });
        await refreshAll({ automatic: true });
      });
    }

    function bindDoctorFindingActions() {
      document.querySelectorAll("[data-doctor-remedy]").forEach((button) => {

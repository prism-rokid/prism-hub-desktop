<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <script>
    // Resolve the saved preference before CSS paints, avoiding a light flash
    // when the dashboard was last used in dark mode.
    (() => {
      try {
        const preference = localStorage.getItem("prism.dashboard.theme");
        const theme = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
          ? "dark"
          : "light";
        document.documentElement.dataset.theme = theme;
      } catch {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      /* Theme contract: components consume semantic tokens only. Layout is
         deliberately defined outside these two blocks. */
      --canvas: #f7f7fa;
      --surface: #ffffff;
      --surface-soft: #f3f4f6;
      --surface-raised: #f7f8fa;
      --surface-hover: #e9e9ed;
      --app-bg: #f3f4f6;
      --login-bg: #f8f8fc;
      --card-bg: #ffffff;
      --drawer-bg: #f7f7fa;
      --drawer-card-bg: #ffffff;
      --compact-control-fill: #f0f0f3;
      --usage-ink: #3d3e45;
      --inverse: #0a0a0a;
      --inverse-soft: #171717;
      --ink: #17191c;
      --muted: #737982;
      --faint: #a4a9b0;
      --line: #e4e7eb;
      --line-strong: #d7dbe0;
      --card-line: #e1e1e680;
      --app-line: rgba(215, 219, 224, 0.9);
      --control-line: rgba(215, 219, 224, 0.9);
      --neutral-fill: #eef0f2;
      --control-fill: #f0f0f3;
      --control-ink: #34353c;
      --control-muted: #51515c;
      --segment-bg: #ececf1;
      --segment-active-bg: #ffffff;
      --input-bg: #ffffff;
      --input-muted: #757d86;
      --button-on-inverse: #ffffff;
      --login-action: #3d3e45;
      --login-action-hover: #303136;
      --login-action-ink: #ffffff;
      --overlay: rgba(10, 10, 10, .28);
      --drawer-overlay: rgba(236, 236, 241, .26);
      --drawer-open-shadow: none;
      --tooltip-bg: #fffaf0;
      --tooltip-line: #ead7b1;
      --tooltip-ink: #714a0c;
      --switch-track: #dadddf;
      --switch-thumb: #ffffff;
      --switch-thumb-on: #ffffff;
      --switch-on: #16845b;
      --accent: #4a9fd8;
      --accent-soft: #eaf5fc;
      --success: #16845b;
      --success-bright: #48d597;
      --success-soft: #e9f7f1;
      --warning: #9a6818;
      --warning-soft: #fff8e9;
      --recovery-notice-bg: #ffffff;
      --recovery-notice-border: #f7cf7e80;
      --danger: #b54747;
      --danger-soft: #fff0f0;
      --shadow: 0 20px 60px rgba(15, 19, 24, 0.16);
      --drawer-shadow: -12px 0 40px rgba(15, 19, 24, 0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 0;
      display: block;
      overflow: hidden;
      background: var(--surface);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }
    code, pre, .mono, textarea { font-family: "Geist Mono", "SFMono-Regular", Menlo, monospace; }

    .app {
      position: relative;
      width: 100%;
      max-width: none;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface-soft);
      border: 1px solid var(--app-line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .app.auth-mode {
      background: var(--surface);
    }

    .app-header {
      position: relative;
      z-index: 20;
      height: 58px;
      flex: 0 0 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .auth-mode .app-header { display: none; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--inverse);
      color: #fff;
    }

    .brand-mark svg { width: 15px; height: 15px; }

    .brand-copy { display: grid; gap: 1px; }
    .brand-copy strong {
      font-size: 12px;
      line-height: 1.1;
      letter-spacing: .08em;
    }
    .brand-copy span {
      color: #8a8f98;
      font-size: 8px;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button,
    .account-trigger {
      border: 0;
      background: var(--surface-soft);
      cursor: pointer;
      transition: background .16s ease, transform .16s ease;
    }

    .icon-button:hover,
    .account-trigger:hover { background: #e9ebee; }
    .icon-button:active,
    .account-trigger:active { transform: scale(.96); }

    .icon-button {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 8px;
    }

    .icon-button svg { width: 14px; height: 14px; }

    .account-trigger {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 8px 0 4px;
      border-radius: 16px;
    }

    .account-trigger strong {
      max-width: 86px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 9px;
    }

    .avatar {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 9px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: 0;
    }

    .viewport {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .page {
      display: none;
      width: 100%;
      height: 100%;
      overflow: auto;
      scrollbar-width: none;
    }

    .page::-webkit-scrollbar { display: none; }
    .drawer::-webkit-scrollbar { display: none; }

    .page.active { display: block; }

    .host-hero {
      min-height: 150px;
      padding: 17px 20px;
      display: grid;
      gap: 12px;
      color: #fff;
      background: var(--inverse);
    }

    .host-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #7d8490;
      font: 600 8px/1.2 "Geist Mono", "SFMono-Regular", monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .host-head h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 680;
      letter-spacing: -.02em;
    }

    .host-meta {
      margin: 4px 0 0;
      color: #8e949d;
      font: 400 8px/1.4 "Geist Mono", "SFMono-Regular", monospace;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 6px 9px;
      border: 1px solid #1f4b3a;
      border-radius: 16px;
      background: #132820;
      color: #8ae4bd;
      font-size: 9px;
      font-weight: 700;
    }

    .live-badge.offline {
      border-color: #5a3535;
      background: #2a1717;
      color: #f0a8a8;
    }

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px rgba(72, 213, 151, .1);
    }

    .connection-grid {
      height: 48px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow: hidden;
      border: 1px solid #262626;
      border-radius: 8px;
      background: var(--inverse-soft);
    }

    .connection-item {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
    }

    .connection-item + .connection-item { border-left: 1px solid #2a2a2a; }

    .connection-icon {
      width: 13px;
      height: 13px;
      flex: 0 0 13px;
      color: var(--success-bright);
    }

    .connection-icon.warning { color: #e6b657; }
    .connection-icon.error { color: #e48383; }

    .connection-copy { min-width: 0; display: grid; gap: 1px; }
    .connection-copy span {
      overflow: hidden;
      color: #7d8490;
      font-size: 8px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .connection-copy strong {
      overflow: hidden;
      color: #ededed;
      font-size: 9px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .workspace {
      padding: 14px 20px 20px;
      display: grid;
      gap: 10px;
    }

    .section-head {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 14px;
      line-height: 1.2;
      letter-spacing: -.01em;
    }

    .count {
      min-width: 22px;
      padding: 3px 7px;
      border-radius: 12px;
      background: #e4e7eb;
      color: #5d636d;
      text-align: center;
      font: 650 8px/1 "Geist Mono", monospace;
    }

    .primary-button,
    .secondary-button,
    .quiet-button,
    .danger-button {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 0 10px;
      cursor: pointer;
      font-size: 9px;
      font-weight: 700;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .primary-button { background: var(--accent); color: #fff; }
    .primary-button:hover { background: #388fc8; }
    .secondary-button { background: #fff; border-color: var(--line); }
    .secondary-button:hover, .quiet-button:hover { background: var(--surface-soft); }
    .quiet-button { background: transparent; border-color: var(--line); color: #555b64; }
    .danger-button { background: var(--danger-soft); color: var(--danger); }
    .primary-button:active,
    .secondary-button:active,
    .quiet-button:active,
    .danger-button:active { transform: scale(.98); }
    button:disabled { cursor: not-allowed; opacity: .48; transform: none !important; }

    .install-panel {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface-raised);
    }

    .install-panel.open { display: grid; gap: 8px; }

    .install-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 10px;
      font-weight: 700;
      color: var(--ink, #1f2328);
    }

    .install-title-copy .lucide {
      color: var(--ink, #1f2328);
    }

    .install-row { display: flex; gap: 7px; }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      outline: none;
      background: #fff;
      color: var(--ink);
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    input {
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      font-size: 9px;
    }

    textarea {
      min-height: 86px;
      padding: 10px;
      resize: vertical;
      border-radius: 7px;
      font-size: 9px;
      line-height: 1.5;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 159, 216, .12);
    }

    input::placeholder, textarea::placeholder { color: #8b929a; }

    .agent-list { display: grid; gap: 8px; }

    .agent-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .agent-summary { padding: 12px 14px; display: grid; gap: 10px; }

    .agent-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .agent-identity {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .agent-icon {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #f2f4f6;
      color: #4e545d;
      font: 750 11px/1 "Geist Mono", monospace;
    }

    .agent-icon .agent-brand-avatar,
    .agent-icon .agent-brand-fallback {
      grid-area: 1 / 1;
    }

    .agent-icon .agent-brand-avatar {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .agent-icon.has-brand-avatar .agent-brand-fallback { display: none; }

    .agent-name { min-width: 0; display: grid; gap: 2px; }
    .agent-name strong {
      overflow: hidden;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .agent-name span {
      overflow: hidden;
      color: #91969e;
      font: 400 7.5px/1.2 "Geist Mono", monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .more-button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 28px;
      border: 0;
      border-radius: 7px;
      background: var(--surface-raised);
      cursor: pointer;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .lifecycle {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow: visible;
    }

    .life-step {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #656b73;
      font-size: 8px;
      font-weight: 600;
      white-space: nowrap;
    }

    .life-step i {
      width: 12px;
      height: 12px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--success-soft);
      color: var(--success);
      font-style: normal;
      font-size: 8px;
    }

    .life-step.warning { color: var(--warning); }
    .life-step.warning i { background: var(--warning-soft); color: var(--warning); }
    .life-arrow { color: #c5c9ce; font-size: 10px; }

    .agent-alert {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--warning-soft);
      color: var(--warning);
    }

    .agent-alert strong { display: block; font-size: 9px; margin-bottom: 2px; }
    .agent-alert span { display: block; color: #9b732e; font-size: 8px; line-height: 1.45; }

    .agent-details {
      display: none;
      padding: 0 14px 14px;
    }

    .agent-card.expanded .agent-details { display: grid; gap: 8px; }

    .toggle-row,
    .detail-row {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 9px;
      border-radius: 7px;
      background: var(--surface-raised);
    }

    .toggle-copy, .detail-copy { min-width: 0; display: grid; gap: 2px; }
    .toggle-copy strong, .detail-copy strong { font-size: 9px; }
    .toggle-copy span, .detail-copy span {
      color: var(--muted);
      font-size: 8px;
      line-height: 1.4;
    }

    .switch {
      width: 30px;
      height: 18px;
      flex: 0 0 30px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #dadddf;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      position: relative;
      transition: background .2s ease;
    }

    .switch::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
      transition: transform .2s ease;
    }

    .switch:checked { background: #34c759; }
    .switch:checked::before { transform: translateX(12px); }

    .field { display: grid; gap: 5px; }
    .field label {
      color: #4c525a;
      font-size: 8px;
      font-weight: 650;
    }

    .plugin-runtime-mode {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 30px;
      padding: 0 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      cursor: default;
    }

    .plugin-runtime-label {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .plugin-runtime-mode .appearance-segment {
      flex: 0 0 auto;
      flex-wrap: nowrap;
      border-radius: 7px;
    }

    .plugin-runtime-mode .appearance-option {
      width: auto;
      min-width: 0;
      height: 22px;
      padding: 0 6px;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }

    .agent-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      padding-top: 3px;
    }

    .warning-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
    }

    .warning-list li {
      padding: 9px 10px;
      border-left: 2px solid #d8a543;
      background: var(--warning-soft);
      color: #805915;
      font-size: 8px;
      line-height: 1.5;
    }

    .warning-list li.ok {
      border-color: var(--success);
      background: var(--success-soft);
      color: #256f55;
    }

    .message {
      min-height: 0;
      color: var(--muted);
      font-size: 8px;
      line-height: 1.4;
    }
    .message:empty { display: none; }
    .message.ok { color: var(--success); }
    .message.err { color: var(--danger); }

    .toast {
      position: absolute;
      z-index: 80;
      left: 50%;
      top: 18px;
      display: flex;
      align-items: center;
      gap: 7px;
      max-width: calc(100% - 36px);
      padding: 9px 12px;
      border-radius: 9px;
      background: rgba(25, 27, 30, .94);
      box-shadow: 0 8px 24px rgba(15, 19, 24, .22);
      color: #fff;
      font-size: 9px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -10px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.ok .lucide { color: #65d9a5; }
    .toast.err .lucide { color: #ff9f9f; }

    .confirmation-overlay {
      position: absolute;
      z-index: 90;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 19, 24, .34);
    }

    .confirmation-overlay[hidden] { display: none; }

    .confirmation-dialog {
      width: min(360px, 100%);
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 16px 40px rgba(15, 19, 24, .24);
    }

    .confirmation-dialog h2 { margin: 0; font-size: 14px; }
    .confirmation-dialog p { margin: 9px 0 16px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .confirmation-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .confirmation-actions button { min-width: 74px; }
    .confirmation-confirm { border-color: var(--ink); background: var(--ink); color: #fff; }
    .agent-metadata-form { display: grid; gap: 10px; margin-top: 14px; }
    .agent-metadata-form label { display: grid; gap: 5px; color: var(--muted); font-size: 10px; font-weight: 700; }
    .agent-metadata-form input, .agent-metadata-form textarea {
      width: 100%; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 7px;
      background: var(--surface); color: var(--ink); padding: 8px 9px; font: inherit; font-size: 12px;
    }
    .agent-metadata-form textarea { min-height: 64px; resize: vertical; }
    .toast .lucide { width: 14px; height: 14px; }

    .empty {
      padding: 28px 16px;
      border: 1px dashed var(--line-strong);
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
      font-size: 9px;
      line-height: 1.55;
    }

    .subpage { padding: 16px 20px 24px; display: grid; gap: 12px; }
    .subpage-head { display: flex; align-items: center; gap: 10px; }
    .subpage-head h1 { margin: 0; font-size: 16px; }
    .subpage-head-spacer { flex: 1; }
    .subpage-card {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .row-list { display: grid; }
    .row {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 4px;
      border-bottom: 1px solid #eef0f2;
    }
    .row:last-child { border-bottom: 0; }
    .meta { min-width: 0; display: grid; gap: 3px; }
    .meta strong { font-size: 9px; }
    .meta span {
      overflow: hidden;
      color: var(--muted);
      font-size: 7.5px;
      line-height: 1.4;
      text-overflow: ellipsis;

    /* Bridge the visual gap between the status and its floating menu so the
       parent stays hovered while the pointer moves down into the menu. */
    .recovery-control.is-recoverable::after {
      content: "";
      position: absolute;
      z-index: 59;
      top: calc(100% - 8px);
      right: -10px;
      left: -10px;
      height: 25px;

      transition: opacity .14s ease, transform .14s ease, visibility .14s ease;

      pointer-events: auto;

    :root[data-theme="dark"] {

    /* Theme application is shared. Do not add component selectors to a

    .icon-button:hover, .account-trigger:hover, .menu-action:hover, .drawer-item:hover { background: var(--surface-hover); }
    .row { border-color: var(--line); }

    .agent-alert { background: var(--warning-soft); }

    /* One desktop layout, authored from the light control-surface spec.
       Theme changes never alter geometry, density, or interaction. */
    .page[data-page="dashboard"].active { gap: 32px; padding: 28px 34px; }
    .compact-header { min-height: 40px; align-items: center; }
    .compact-chain { gap: 8px; }
    .compact-chain-item { gap: 6px; }
    .compact-chain-icon { width: 16px; height: 16px; flex-basis: 16px; }
    .compact-chain-copy { gap: 1px; }

    .compact-chain-copy strong { font-size: 12px; font-weight: 400; }
    .compact-arrow { width: 12px; height: 12px; }
    .compact-actions { gap: 12px; }
    .compact-actions .icon-button { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 20px; }
    .compact-actions .icon-button svg { width: 18px; height: 18px; }
    /* A verified Desktop update stays unobtrusive as an icon until intent is
       clear. Hover/focus expands the same control to its localized action
       label, rather than introducing a separate banner or modal. */
    .compact-actions .desktop-update-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      /* Keep the icon geometrically centered while the label is collapsed.
         A flex gap still occupies space even when the label has zero width. */
      gap: 0;
      overflow: hidden;
      color: var(--control-ink);
      transition: width .16s ease, padding .16s ease, border-color .16s ease, background .16s ease, color .16s ease, transform .16s ease;
    }
    .desktop-update-label {
      max-width: 0;
      overflow: hidden;
      opacity: 0;
      font-size: 13px;
      font-weight: 650;
      line-height: 1;
      white-space: nowrap;
      transition: max-width .16s ease, opacity .12s ease;
    }
    .compact-actions .desktop-update-button:hover,
    .compact-actions .desktop-update-button:focus-visible {
      width: 78px;
      padding: 0 12px;
      gap: 6px;
      border-color: #526cff;
      background: rgb(82 108 255 / 10%);
      color: #526cff;

    .desktop-update-button:hover .desktop-update-label,
    .desktop-update-button:focus-visible .desktop-update-label { max-width: 36px; opacity: 1; }
    .desktop-update-button.is-installing { cursor: wait; color: #526cff; }
    /* Installing state swaps the download glyph for a static progress ring:
       the arc is driven by stroke-dashoffset from the mirrored download
       progress, with no rotation animation. */
    .desktop-update-icon { display: inline-flex; }
    .desktop-update-button.is-installing .desktop-update-icon { display: none; }
    .desktop-update-ring { display: none; width: 18px; height: 18px; flex: 0 0 18px; }
    .desktop-update-button.is-installing .desktop-update-ring { display: block; }
    .desktop-update-ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
    .desktop-update-ring circle { fill: none; stroke-width: 2.5; }
    .desktop-update-ring .ring-track { stroke: rgb(82 108 255 / 22%); }
    .desktop-update-ring .ring-fill { stroke: #526cff; stroke-linecap: round; stroke-dasharray: 50.27; stroke-dashoffset: 50.27; transition: stroke-dashoffset .3s ease; }
    .remote-panel-button { height: 40px; display: inline-flex; align-items: center; gap: 4px; padding: 0 12px; border: 1px solid var(--line); border-radius: 22px; background: var(--control-fill); color: var(--control-muted); cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }

    .login-page { padding: 46px 110px; }
    .login-logo, .login-logo-image { width: 64px; height: 64px; }
    .login-form { width: min(420px, 100%); margin-top: 28px; gap: 16px; }
    .segmented { height: 44px; padding: 4px; }
    .field { gap: 6px; }
    .field label { font-size: 12px; }
    .login-input-shell { height: 46px; padding: 0 14px; }
    .login-input-shell input { height: 44px; font-size: 14px; }
    .login-helper { font-size: 12px; }
    .login-button, .register-button { height: 46px; min-height: 46px; font-size: 14px; }

    /* Dashboard polish: these are shared component rules, not theme variants. */
    .install-panel { background: transparent; }
    .scan-button,
    .install-row .secondary-button {
      border: 1px solid #e8eaed;
      background: transparent;
    }
    .agent-card { border: 1px solid var(--card-line); }
    .agent-name > span {
      font-family: "Geist Mono", "SFMono-Regular", Menlo, monospace;
      font-weight: normal;
      font-synthesis: none;
    }

    .confirmation-overlay {
      padding: 24px;
      background: rgba(15, 19, 24, .38);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #agent-metadata-overlay {
      background: rgba(247, 247, 250, .46);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .confirmation-dialog {
      width: min(380px, 100%);
      padding: 20px;
      border-color: var(--line-strong);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 20px 52px rgba(15, 19, 24, .22);
    }
    .confirmation-dialog h2 { font-size: 18px; line-height: 1.35; letter-spacing: -.015em; }
    .confirmation-dialog p { margin: 8px 0 20px; font-size: 13px; line-height: 1.55; }
    .confirmation-actions { gap: 8px; }
    .confirmation-actions .secondary-button {
      min-width: 104px;
      min-height: 40px;
      border-color: var(--line-strong);
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }
    .confirmation-actions .secondary-button:hover { background: var(--surface-soft); }
    /* Normal confirmation actions share one neutral style; a dark primary
       action made its label unreadable after the light-theme hover rule ran. */
    .confirmation-dialog:not([data-tone="danger"]) .confirmation-actions .confirmation-confirm {
      border-color: var(--line-strong);
      background: transparent;
      color: var(--ink);
    }
    .confirmation-dialog:not([data-tone="danger"]) .confirmation-actions .confirmation-confirm:hover:not(:disabled) {
      background: var(--surface-soft);
      color: var(--ink);
    }
    .confirmation-dialog[data-tone="danger"] .confirmation-confirm {
      border-color: var(--danger);
      background: var(--danger);
      color: #fff;
    }
    .confirmation-dialog[data-tone="danger"] .confirmation-confirm:hover { filter: brightness(.94); }

    /* Plugin management is intentionally a progressive disclosure: the home
       surface keeps one entry point, while package mutations live in this
       focused panel. */
    .plugin-home { align-items: flex-start; }
    .agent-list-section-head {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .agent-list-section-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--ink);
      font-size: 18px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -.02em;
    }
    .agent-list-section-title .lucide { width: 20px; height: 20px; }
    .agent-recovery-notices {
      display: grid;
      gap: 8px;
    }
    .agent-recovery-notices-head {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 2px;
    }
    .agent-recovery-notices-head h3 {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }
    .agent-recovery-notice-count {
      color: var(--accent);
      font-size: 13px;
      font-style: normal;
      line-height: 1;
    }
    .agent-recovery-notices-toggle {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .agent-recovery-notices-toggle:hover { background: var(--surface-hover); color: var(--ink); }
    .agent-recovery-notices-toggle .lucide { width: 16px; height: 16px; transition: transform .16s ease; }
    .agent-recovery-notices.is-collapsed .agent-recovery-notices-toggle .lucide { transform: rotate(180deg); }
    .agent-recovery-notices-list { display: grid; gap: 8px; }
    .agent-recovery-notices.is-collapsed .agent-recovery-notices-list { display: none; }
    .agent-recovery-notice {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--recovery-notice-border);
      border-radius: 12px;
      background: var(--recovery-notice-bg);
    }
    .agent-recovery-notice-copy { min-width: 0; display: grid; gap: 2px; }
    .agent-recovery-notice-copy strong { font-size: 13px; line-height: 1.3; }
    .agent-recovery-notice-copy span { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .agent-recovery-notice-actions { display: flex; flex-wrap: nowrap; justify-content: flex-end; gap: 6px; }
    .agent-recovery-notice-actions .recovery-action {
      width: auto;
      min-height: 32px;
      border: 1px solid var(--line);
      padding: 0 10px;
      background: var(--control-fill);
      color: var(--control-ink);
      font-size: 12px;
      white-space: nowrap;
    }
    .agent-recovery-notice-actions .recovery-action:hover:not(:disabled) { border-color: var(--line-strong); }
    @media (max-width: 420px) {
      .agent-recovery-notice { gap: 8px; padding: 12px; }
      .agent-recovery-notice-actions { gap: 4px; }
      .agent-recovery-notice-actions .recovery-action { padding: 0 7px; font-size: 11px; }
    }
    .plugin-manager-entry {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 400;
    }
    .plugin-manager-entry:hover { background: var(--surface-hover); }
    .plugin-manager-entry .lucide { width: 15px; height: 15px; }
    .plugin-manager-entry span { font-style: normal; }
    .plugin-manager-anchor { position: relative; display: inline-flex; flex: 0 0 auto; }
    .plugin-manager-entry.needs-plugin {
      border-color: #526cff;
      background: #526cff;
      color: #fff;
    }
    .plugin-manager-entry.needs-plugin:hover { background: #425de8; }
    .agent-empty-illustration {
      position: absolute;
      z-index: 1;
      top: 100%;
      right: 100%;
      width: min(166px, calc(100vw - 40px));
      height: auto;
      pointer-events: none;
      user-select: none;
    }
    .agent-list.agent-list-empty { min-height: 247px; }

    .plugin-manager-overlay {
      position: absolute;
      z-index: 70;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 26px;
      background: rgba(247, 247, 250, .46);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    /* Doctor entry and read-only diagnostics panel (M1). */
    .doctor-entry { position: relative; }
    .doctor-entry-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 14px;
      height: 14px;
      display: grid;
      place-items: center;
      padding: 0 3px;
      border-radius: 999px;
      background: var(--danger);
      color: #ffffff;
      font-size: 8px;
      font-weight: 700;
      line-height: 1;
    }
    .doctor-dialog { width: min(560px, 100%); }
    .doctor-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .doctor-meta .doctor-meta-state { font-weight: 650; }
    .doctor-meta .doctor-meta-state.ok { color: var(--success); }
    .doctor-meta .doctor-meta-state.findings { color: var(--danger); }
    .doctor-findings { display: grid; gap: 6px; }
    .doctor-finding {
      display: grid;
      gap: 3px;
      padding: 9px;
      border-radius: 9px;
      background: var(--surface-raised);
    }
    .doctor-finding-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 650;
    }
    .doctor-finding-head .lucide { width: 13px; height: 13px; flex: 0 0 13px; }
    .doctor-finding.critical .doctor-finding-head { color: var(--danger); }
    .doctor-finding.warning .doctor-finding-head { color: #b06a00; }
    .doctor-finding.info .doctor-finding-head { color: var(--muted); }
    .doctor-finding-meta { color: var(--muted); font-size: 10px; }
    .doctor-finding-hint {
      margin-top: 2px;
      color: var(--ink);
      font-size: 11px;
      line-height: 1.5;
    }
    .doctor-escalated-badge {
      flex: 0 0 auto;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(214, 69, 69, .12);
      color: var(--danger);
      font-size: 9px;
      font-weight: 700;
    }
    .doctor-finding-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }
    .doctor-remedy-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 26px;
      padding: 0 10px;
      border: 1px solid var(--accent);
      border-radius: 7px;
      background: var(--accent);
      color: #ffffff;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
    }
    .doctor-remedy-button .lucide { width: 12px; height: 12px; }
    .doctor-remedy-button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
    .doctor-remedy-button:hover { filter: brightness(.95); }
    .doctor-remedy-button:disabled { opacity: .55; cursor: default; }
    .doctor-dismiss-button {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 10px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .doctor-dismiss-button:hover { background: var(--surface-hover); color: var(--ink); }
    .doctor-entry.attention .doctor-entry-badge { background: #d64545; }
    .doctor-history { display: grid; gap: 2px; }
    .doctor-history-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 10px;
    }
    .doctor-history-row:hover { background: var(--surface-raised); }
    .doctor-history-label { font-weight: 650; color: var(--muted); }
    .doctor-history-row.failed .doctor-history-label { color: var(--danger); }
    .doctor-history-meta {
      color: var(--muted);
      font-size: 9px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }
    .doctor-finding-detail {
      color: var(--muted);
      font-size: 10px;
      font-family: "Geist Mono", ui-monospace, monospace;
      word-break: break-all;
    }
    .doctor-checks { display: grid; gap: 2px; }
    .doctor-check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 11px;
    }
    .doctor-check-row:hover { background: var(--surface-raised); }
    .doctor-check-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
    .doctor-check-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--success); flex: 0 0 7px; }
    .doctor-check-dot.findings { background: var(--danger); }
    .doctor-check-dot.error { background: var(--danger); }
    .doctor-check-dot.idle { background: var(--line-strong); }
    .doctor-check-value { color: var(--muted); font-size: 10px; text-align: right; }
    .plugin-manager-dialog {
      width: min(680px, 100%);
      max-height: min(620px, calc(100dvh - 52px));
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
      padding: 14px 14px 30px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .plugin-manager-head,
    .plugin-library-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .plugin-manager-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .plugin-manager-title .icon-button { margin-left: -5px; background: transparent; }
    .plugin-manager-title .icon-button:hover { background: var(--surface-hover); }
    #refresh-plugin-library-btn { font-size: 13px; }
    #refresh-plugin-library-btn .lucide { width: 14px; height: 14px; }
    .plugin-library-scroll { min-height: 0; overflow: auto; padding-right: 2px; }
    .plugin-library-section + .plugin-library-section { margin-top: 18px; }
    .plugin-library-head { margin: 0 0 8px; }
    .plugin-library-head h3 { margin: 0; font-size: 12px; font-weight: 700; }
    .plugin-library-head span { color: var(--muted); font-size: 11px; }
    .plugin-catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .plugin-catalog-card {
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 9px;
      overflow: hidden;
      padding: 9px;
      border-radius: 9px;
      background: var(--surface-raised);
    }
    .plugin-catalog-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 28px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface);
      color: var(--muted);
      font: 700 10px/1 "Geist Mono", monospace;
    }
    .plugin-catalog-icon img,
    .plugin-catalog-icon .agent-brand-fallback { grid-area: 1 / 1; }
    .plugin-catalog-icon img { width: 100%; height: 100%; object-fit: contain; background: var(--surface); }
    .plugin-catalog-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 650;
    }
    .plugin-catalog-status,
    .plugin-catalog-action {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 650;
    }
    .plugin-catalog-status.installed { color: var(--success); }
    .plugin-catalog-status.available { color: var(--muted); }
    .plugin-catalog-action {
      display: none;
      min-height: 26px;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 8px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .plugin-catalog-action.danger { color: var(--danger); border-color: var(--line); }
    .plugin-catalog-action .lucide { width: 12px; height: 12px; }
    .plugin-catalog-progress {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .plugin-catalog-progress-ring {
      position: relative;
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      flex: 0 0 28px;
      border-radius: 50%;
      background: conic-gradient(var(--accent) calc(var(--progress) * 1%), var(--line) 0);
    }
    .plugin-catalog-progress-ring::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--surface-raised);
    }
    .plugin-catalog-progress-ring b { position: relative; font: 700 8px/1 "Geist Mono", monospace; }
    .plugin-catalog-card:hover .plugin-catalog-status,
    .plugin-catalog-card:focus-within .plugin-catalog-status { display: none; }
    .plugin-catalog-card:hover .plugin-catalog-action,
    .plugin-catalog-card:focus-within .plugin-catalog-action { display: inline-flex; }
    .plugin-catalog-empty {
      padding: 18px;
      border: 1px dashed var(--line-strong);
      border-radius: 9px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    @media (max-width: 600px) {
      .plugin-manager-overlay { padding: 12px; }
      .plugin-catalog-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      body { background: var(--canvas); }
      .app {
        width: 100%;
        max-width: none;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .login-page { padding-left: 32px; padding-right: 32px; }
    }

    @media (max-height: 543px) {
      .page[data-page="dashboard"].active { padding-top: 16px; padding-bottom: 16px; }
      .login-page { padding-top: 24px; padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <div class="app auth-mode">
    <main class="viewport">
      <section class="page login-page active" data-page="login">
        <div class="login-brand" aria-label="Prism HUB">
          <div class="login-logo">
            <img class="login-logo-image" src="/assets/prism_logo_nobg@2x.png" alt="">
          </div>
          <strong class="login-wordmark">Prism HUB</strong>
        </div>
        <form class="login-form" id="login-form" autocomplete="on">
          <div class="field">
            <label data-i18n="login.region">Region</label>
            <div class="segmented" role="group" data-i18n-aria-label="login.region" aria-label="Region">
              <button class="segment active" type="button" data-region="cn">CN</button>
              <button class="segment" type="button" data-region="global" disabled>Global (Upcoming)</button>
            </div>
          </div>
          <div class="field">
            <label for="login-username" data-i18n="login.account">Rokid Account</label>
            <div class="login-input-shell">
              <i data-lucide="user" aria-hidden="true"></i>
              <input id="login-username" name="username" type="text" autocomplete="username" data-i18n-placeholder="login.username_placeholder" placeholder="Phone, email, or username">
            </div>
          </div>
          <div class="field">
            <label for="login-password" data-i18n="login.password">Password</label>
            <div class="login-input-shell">
              <i data-lucide="lock-keyhole" aria-hidden="true"></i>
              <input id="login-password" name="password" type="password" autocomplete="current-password" data-i18n-placeholder="login.password_placeholder" placeholder="Enter your password">
              <button class="password-toggle" id="password-visibility-btn" type="button" data-i18n-aria-label="login.show_password" aria-label="Show password">
                <i data-lucide="eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <input id="login-host-alias" type="hidden">
          <div class="login-helper">
            <span aria-hidden="true"></span>
            <a id="forgot-password-link" href="{{.ForgotPasswordURL}}" target="_blank" rel="noopener noreferrer" data-i18n="login.forgot_password">Forgot password?</a>
          </div>
          <button class="login-button" id="password-login-btn" type="submit"><span data-i18n="login.submit">Login</span><i data-lucide="arrow-right" aria-hidden="true"></i></button>
          <a id="register-account-link" class="register-button" href="{{.RegisterURL}}" target="_blank" rel="noopener noreferrer" data-i18n="login.register_account">Register account</a>
          <span class="message" id="login-message" aria-live="polite"></span>
        </form>
      </section>

      <section class="page" data-page="dashboard">
        <div id="login-transition-status" class="agent-recovery-notice" role="status" aria-live="polite" hidden>
          <div class="agent-recovery-notice-copy"><strong data-i18n="login.success">登录成功</strong><span id="login-transition-detail"></span></div>
        </div>
        <section class="compact-header">
          <div class="compact-chain">
            <div class="compact-chain-item">
              <i class="compact-chain-icon" id="hub-icon" data-lucide="activity" aria-hidden="true"></i>
              <div class="compact-chain-copy"><span>Hub</span><strong id="hub-value">检查中</strong></div>
            </div>
            <i class="compact-arrow" data-lucide="chevron-right" aria-hidden="true"></i>
            <div class="compact-chain-item recovery-control" id="server-recovery-control">
              <i class="compact-chain-icon" id="server-icon" data-lucide="server" aria-hidden="true"></i>
              <div class="compact-chain-copy"><span data-i18n="status.server">服务器</span><strong id="server-value">检查中</strong></div>
              <div class="recovery-popover" role="group" aria-label="服务器连接恢复操作">
                <button class="recovery-action" id="server-recovery-action" type="button" data-recovery-action="connection-refresh">
                  <i data-lucide="refresh-cw" aria-hidden="true"></i><span>刷新连接</span>
                </button>
              </div>
            </div>
            <i class="compact-arrow" data-lucide="chevron-right" aria-hidden="true"></i>
            <div class="compact-chain-item" id="host-plugin-sync-control" title="">
              <i class="compact-chain-icon" id="host-plugin-sync-icon" data-lucide="plug-zap" aria-hidden="true"></i>
              <div class="compact-chain-copy"><span data-i18n="status.host_plugin_sync">Host Plugin</span><strong id="host-plugin-sync-value" data-i18n="status.checking">检查中</strong></div>
            </div>
            <i class="compact-arrow" data-lucide="chevron-right" aria-hidden="true"></i>
            <div class="remote-panel-control" id="remote-panel-control">
              <button class="remote-panel-button" id="remote-panel-btn" type="button" data-i18n-aria-label="nav.remote_panel" aria-label="远程面板" aria-describedby="remote-panel-tooltip">
                <span class="remote-panel-logo" aria-hidden="true"></span>
                <span data-i18n="nav.remote_panel">远程面板</span>
              </button>
              <div class="remote-panel-tooltip" id="remote-panel-tooltip" role="tooltip" hidden>
                <img class="remote-panel-qr" id="remote-panel-qr" alt="">
                <span class="remote-panel-tooltip-copy" data-i18n="nav.remote_panel_qr_hint">扫描二维码，在手机上打开远程面板</span>
              </div>

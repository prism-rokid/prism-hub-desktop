    async function installCatalogPlugin(pluginId) {
      return runPluginCatalogOperation("/api/plugins/catalog/install", pluginId);
    }

    async function updateCatalogPlugin(pluginId) {
      return runPluginCatalogOperation("/api/plugins/catalog/update", pluginId);
    }

    function setPluginCatalogOperation(pluginId, operation) {
      if (!pluginId) return;
      if (operation) state.pluginCatalogOperations.set(pluginId, operation);
      else state.pluginCatalogOperations.delete(pluginId);
      renderPluginCatalog();
    }

    async function waitForPluginOperation(operationId, pluginId) {
      const deadline = Date.now() + 15 * 60 * 1000;
      while (Date.now() < deadline) {
        const response = await fetch(`/api/plugins/operations/${encodeURIComponent(operationId)}`, { cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || t("agent.install_plugin_failed"));
        const operationState = data.state || data.status;
        if (operationState === "completed") return data;
        if (operationState === "failed") throw new Error(data.error || t("agent.install_plugin_failed"));
        setPluginCatalogOperation(pluginId || data.plugin_id, {
          state: operationState || "queued",
          downloaded_bytes: data.downloaded_bytes,
          download_total_bytes: data.download_total_bytes,
        });
        await new Promise((resolve) => window.setTimeout(resolve, 750));
      }
      throw new Error("插件操作等待超时，请稍后刷新查看状态。");
    }

    async function runPluginCatalogOperation(endpoint, pluginId) {
      setPluginCatalogOperation(pluginId, { state: "queued" });
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ plugin_id: pluginId }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || t("agent.install_plugin_failed"));
        setPluginCatalogOperation(pluginId, { state: data.state || "queued" });
        const completed = data.operation_id ? await waitForPluginOperation(data.operation_id, pluginId) : data;
        setScopedMessage("plugins-message", composeScopedSuccess(t("agent.plugin_installed", { name: completed.plugin_id || pluginId }), completed.hub_apply), "ok");
        await refreshPluginLibrary({ notify: false });
        // The catalog operation ran inside the modal plugin manager. Close it
        // so the returned dashboard shows the freshly installed agent instead
        // of leaving a modal that covers the cards and blocks their actions.
        closePluginManager();
        return completed;
      } finally {
        setPluginCatalogOperation(pluginId, null);
      }
    }

    async function scanLocalPlugins({ showProgress = true } = {}) {
      const scanButton = document.getElementById("scan-local-btn");
      if (showProgress) showToast("扫描中···", "ok");
      if (scanButton) scanButton.disabled = true;
      try {
        const response = await fetch("/api/plugins/scan", { method: "POST" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || "扫描本地 Plugins 失败");
        await refreshAll();
        const installedPluginIDs = Array.isArray(data.installed_plugin_ids) ? data.installed_plugin_ids : [];
        if (showProgress && installedPluginIDs.length > 0) {
          showToast(`已自动安装 ${installedPluginIDs.length} 个本地 Plugin`, "ok");
        }
        return data;
      } finally {
        if (scanButton) scanButton.disabled = false;
      }
    }

    async function refreshDashboard({ notify = true } = {}) {
      try {
        const response = await fetch("/api/connection/refresh", { method: "POST" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.error || "刷新服务器连接失败");
        if (data.action === "reauth_required") {
          state.reauthRequired = true;
          switchPage("login");
          setScopedMessage("login-message", data.message || "登录凭证已失效，请重新登录以恢复服务器连接。", "err");
          window.setTimeout(() => document.getElementById("login-username")?.focus(), 0);
          return data;
        }
        if (data.action === "bridge_disabled") {
          if (notify) showToast(data.message || "Bridge 当前已关闭。", "err");
          return data;
        }
        if (hubRestartScheduled(data)) {
          // The sidecar stops itself shortly after this response. Refreshing
          // now would only race the outgoing process; the restart flow waits
          // for the replacement and reloads this page instead.
          if (notify) showToast(data.message || t("action.connection_refreshed"), "ok");
          handleScheduledHubRestart();
          return data;
        }
        await refreshAll();
        if (notify) showToast(data.message || t("action.connection_refreshed"), "ok");
        // The Realtime client publishes connection state asynchronously;
        // keep sampling until the header stops flipping through connecting.
        scheduleStatusSettle(() => cloudConnectionActive());
        return data;
      } catch (error) {
        if (notify) showToast(dashboardRequestMessage(error), "err");
        throw error;
      }
    }

    function finishLoginTransition() {
      state.loginTransition = false;
      window.clearTimeout(state.loginTransitionTimer);
      state.loginTransitionTimer = null;
      document.getElementById("login-transition-status").hidden = true;
    }

    function beginLoginTransition(data) {
      state.authRevision++;
      state.loginTransition = true;
      state.reauthRequired = false;
      state.lastHostPlugins = null;
      state.lastHostPluginsAt = 0;
      window.clearTimeout(state.loginTransitionTimer);
      document.getElementById("login-transition-status").hidden = false;
      document.getElementById("login-transition-detail").textContent = t("login.starting_hub");
      applyStatus({
        ...(state.lastStatus || {}),
        ok: true, logged_in: true, host_token_set: true, remote_control_ready: false,
        account: data.account || {}, connection_state: "connecting", connection_label: t("status.connecting"),
        connection_detail: t("login.starting_hub"), host_plugin_sync_state: "syncing",
      }, { force: true });
      switchPage("dashboard");
      // One bounded deadline; a delayed restart must never look like a login failure.
      state.loginTransitionTimer = window.setTimeout(() => {
        state.loginTransitionTimer = null;
        document.getElementById("login-transition-detail").textContent = t("login.startup_delayed");
      }, 60_000);
    }

    async function submitPasswordLogin() {
      if (state.loginSubmitting || state.loginTransition) return;
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;
      const hostAlias = document.getElementById("login-host-alias").value.trim();
      if (!username || !password) {
        setScopedMessage("login-message", "请输入账号和密码。", "err");
        return;
      }
      const button = document.getElementById("password-login-btn");
      state.loginSubmitting = true;
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      button.querySelector("span").textContent = t("login.signing_in");
      setScopedMessage("login-message", t("login.signing_in"));
      try {
        const response = await fetch("/api/login/password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, host_alias: hostAlias, region: state.region }),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error_code === "C100500" ? t("login.credentials_mismatch") : (data.error || "账号密码登录失败"));
        document.getElementById("login-password").value = "";
        beginLoginTransition(data);
        if (hubRestartScheduled(data)) {
          handleScheduledHubRestart();
          return data;
        }
        // Authentication has succeeded: subsequent startup errors belong to
        // the Dashboard, never to the login form.
        try {
          await refreshAll();
          scheduleStatusSettle(() => cloudConnectionActive());
        } catch (error) {
          document.getElementById("login-transition-detail").textContent = dashboardRequestMessage(error);
        }
        const scan = data.local_plugin_scan;
        if (scan && scan.ok === false) {
          setScopedMessage("plugins-message", String(scan.error || "扫描本地 Plugins 失败"), "err");
        }
        return data;
      } finally {
        state.loginSubmitting = false;
        button.disabled = false;
        button.removeAttribute("aria-busy");
        button.querySelector("span").textContent = t("login.submit");
      }
    }

    async function logout() {
      finishLoginTransition();
      state.authRevision++;
      closeDrawer();
      setScopedMessage("login-message", "正在退出登录…");
      const response = await fetch("/api/logout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "退出登录失败");
      setScopedMessage("login-message", composeScopedSuccess(data.warning || "已退出登录。", data.hub_apply), data.warning ? "err" : "ok");
      await refreshAfterDashboardMutation(data);
    }

        pluginId: normalized,
        displayName: String(persisted.display_name || runtime.display_name || normalized),
        description: String(persisted.description || runtime.description || ""),
        iconUrl: String(persisted.icon_url || runtime.icon_url || ""),
      };

    async function submitAgentMetadataEditor() {

      const description = agentMetadataFor(pluginId).description.trim();

    async function launchDesktopApp(appId, { notify = true } = {}) {
      if (!appId) return;
      if (state.managedLaunches.has(appId)) return;
      state.managedLaunches.add(appId);
      if (state.lastStatus) applyStatus(state.lastStatus, { force: true });
      const desktopCard = state.lastStatus?.desktop_apps?.[appId] || null;
      try {
        const confirmationMessage = String(desktopCard?.managed_confirmation_message || "").trim();
        if (confirmationMessage && !await requestDashboardConfirmation(confirmationMessage, {
          title: t("agent.managed_relaunch"),
          confirmText: t("common.continue"),
        })) return;
        if (notify) setScopedMessage("plugins-message", t("agent.managed_starting", { name: desktopCard?.display_name || appId }));
        const response = await fetch(`/api/desktop/${encodeURIComponent(appId)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "start" }),
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || `启动 ${appId} 失败`);
        if (notify) setScopedMessage("plugins-message", data.message || `${appId} 已切到 Prism 托管启动。`, "ok");
        await refreshAll();
        scheduleManagedDesktopStatusRefresh(appId);
        return data;
      } finally {
        state.managedLaunches.delete(appId);
        if (state.lastStatus) applyStatus(state.lastStatus, { force: true });
      }
    }

    function bindRecoveryActions(root = document) {
      bindRecoveryControls(root);
      root.querySelectorAll("[data-recovery-action]").forEach((button) => {
        if (button.dataset.recoveryActionBound === "true") return;
        button.dataset.recoveryActionBound = "true";
        button.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          const action = button.dataset.recoveryAction;
          const key = button.dataset.recoveryKey || action;
          if (action === "connection-refresh") {
            runRecoveryAction(button, key, async () => {
              const result = await refreshDashboard({ notify: false });
              if (result?.action === "bridge_disabled") throw new Error(result.message || "Bridge 当前已关闭。");
              return result;
            }, {
              messageElementId: "plugins-message",
              successMessage: (result) => result?.action === "reauth_required"
                ? ""

            return;

          if (action === "managed-launch") {
            const appId = button.dataset.recoveryApp;
            const pluginId = button.dataset.recoveryPlugin;
            runRecoveryAction(button, key, () => launchDesktopApp(appId, { notify: false }), {
              successMessage: (result) => result?.message || (result ? t("agent.managed_recovered", { name: pluginDisplayName(pluginId) }) : ""),

    function startAutoRefresh() {
      stopAutoRefresh();
      if (dashboardIsHidden() || state.awaitingHubRestart || !state.browserOnline) return;
      state.refreshTimer = window.setTimeout(async () => {
        state.refreshTimer = null;

    const STATUS_SETTLE_DELAYS = [1000, 2500, 5000, 8000, 12000, 18000, 25000];

    // One bounded sequence per action. Stop as soon as its result is visible;
    // never wake hidden/offline windows or repeatedly fetch cloud plugin data.
    function scheduleStatusSettle(shouldStop = () => false, delays = STATUS_SETTLE_DELAYS) {
      let index = 0;
      let previousDelay = 0;
      const scheduleNext = () => {
        if (index >= delays.length || dashboardIsHidden() || state.awaitingHubRestart || !state.browserOnline) return;
        if (typeof shouldStop === "function" && shouldStop()) return;
        const delay = delays[index++];
        const timer = window.setTimeout(async () => {
          state.settleTimers.delete(timer);
          if (dashboardIsHidden() || state.awaitingHubRestart || !state.browserOnline) return;
          if (typeof shouldStop === "function" && shouldStop()) return;
          try { await refreshAll({ automatic: true, forceStatus: true }); } catch {}
          scheduleNext();
        }, Math.max(0, delay - previousDelay));
        previousDelay = delay;
        state.settleTimers.add(timer);
      };
      scheduleNext();
    }

    // The plugin reloader applies config/plugin changes to the running
    // runtime asynchronously; a few follow-up samples close the visual gap.
    function scheduleReloaderSettle() {
      scheduleStatusSettle(null, [1500, 4000, 8000]);
    }

    // Detects a response that means "this sidecar stops itself right after
    // answering". desktop_restart_required is deliberately excluded: there
    // the Hub keeps running and only reports that Desktop owns restarts.
    function hubRestartScheduled(payload) {
      const actions = [payload?.action, payload?.hub_apply?.action]
        .map((action) => String(action || "").toLowerCase());
      return actions.includes("restart_scheduled")
        || actions.includes("desktop_restart_scheduled")
        || actions.includes("restart_requested");
    }

    // Hands the restart window to a dedicated recovery flow so the page never
    // keeps rendering the pre-action snapshot waiting for a manual refresh.
    function handleScheduledHubRestart() {
      state.awaitingHubRestart = true;
      if (window.parent !== window) {
        // The Desktop shell waits for the replacement sidecar and reloads
        // this iframe; the freshly booted page re-syncs on its own.
        window.parent.postMessage({ type: "prism:hub-restart-scheduled" }, "*");
        return;
      }
      // A standalone page (for example a browser tab pointed at the
      // Desktop-owned sidecar) gets no reload from anyone: poll through the
      // restart window until the new process answers.
      watchForHubReturn();
    }

    async function watchForHubReturn({ timeoutMs = 60_000, intervalMs = 2_000 } = {}) {
      if (state.hubRestartWatchInFlight) return;
      state.hubRestartWatchInFlight = true;
      try {
        const deadline = Date.now() + timeoutMs;
        while (Date.now() < deadline && state.awaitingHubRestart) {
          await new Promise((resolve) => window.setTimeout(resolve, intervalMs));
          if (!state.awaitingHubRestart) return;
          try {
            await loadStatus({ force: true });
            state.awaitingHubRestart = false;
            if (cloudConnectionActive()) finishLoginTransition();
            await loadHostPlugins({ force: true });
            // The Realtime connection is re-established by the new process;
            // keep sampling until the header settles on connected.
            scheduleStatusSettle(() => cloudConnectionActive());
            return;
          } catch {
            // Still inside the restart window; keep waiting quietly.
          }
        }
      } finally {
        state.hubRestartWatchInFlight = false;
        state.awaitingHubRestart = false;
      }
    }

    // Shared post-mutation refresh: either the action restarted this Hub
    // (recover via the restart flow) or the state is live (forced refresh,
    // plus reloader settle for changes the runtime applies asynchronously).
    async function refreshAfterDashboardMutation(payload) {
      if (hubRestartScheduled(payload)) {
        handleScheduledHubRestart();
        return;
      }
      await refreshAll();
      scheduleReloaderSettle();
    }

    // The daemon dials Realtime on every launch. Poll its short bootstrap
    // window so the Dashboard does not keep rendering a stale disconnected
    // snapshot for the normal 15-second refresh interval. A genuine stopped
    // session is restarted once, but expired credentials remain user-driven.
    function recoverConnectionOnStartup() {
      let recoveryRequested = false;
      [800, 1800, 3500].forEach((delay) => {
        window.setTimeout(async () => {
          if (recoveryRequested || dashboardIsHidden()) return;
          try {
            const data = await loadStatus({ force: true });
            const connectionState = String(data.connection_state || "").toLowerCase();
            if (cloudConnectionUsable(data) || !data.logged_in || !data.bridge_enabled || connectionState !== "disconnected") return;
            recoveryRequested = true;
            await refreshDashboard({ notify: false });
          } catch {
            // The normal refresh loop retains the visible diagnostic state.
          }
        }, delay);
      });
    }

    });
    document.getElementById("drawer-backdrop").addEventListener("click", closeDrawer);
    document.getElementById("refresh-btn").addEventListener("click", () => runDashboardAction("home-message", refreshDashboard));
    document.getElementById("agent-recovery-notices-toggle")?.addEventListener("click", () => {
      state.recoveryNoticesCollapsed = !state.recoveryNoticesCollapsed;
      if (state.lastStatus) renderAgentRecoveryNotices(state.lastStatus);
    });
    document.getElementById("plugin-manager-open-btn").addEventListener("click", openPluginManager);
    document.getElementById("plugin-manager-close-btn").addEventListener("click", closePluginManager);
    document.getElementById("plugin-manager-overlay").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closePluginManager();
    });
    document.getElementById("doctor-open-btn").addEventListener("click", openDoctorPanel);
    document.getElementById("doctor-drawer-btn").addEventListener("click", openDoctorPanel);
    document.getElementById("doctor-close-btn").addEventListener("click", closeDoctorPanel);
    document.getElementById("doctor-overlay").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeDoctorPanel();
    });
    document.getElementById("doctor-run-btn").addEventListener("click", () => runDashboardAction("plugins-message", runDoctorChecks));
    document.getElementById("refresh-plugin-library-btn").addEventListener("click", () => runDashboardAction("plugins-message", refreshPluginLibrary));
    document.getElementById("plugin-install-btn").addEventListener("click", () => runDashboardAction("plugins-message", installPlugin));
    document.getElementById("account-logout-btn").addEventListener("click", () => runDashboardAction("login-message", logout));
    document.getElementById("hub-restart-btn").addEventListener("click", () => runDashboardAction("home-message", restartHub));
    document.getElementById("hub-quit-btn").addEventListener("click", () => runDashboardAction("home-message", quitHub));
    document.getElementById("host-alias-edit-btn").addEventListener("click", enterHostAliasEdit);
    document.getElementById("host-alias-save-btn").addEventListener("click", () => runDashboardAction("home-message", submitHostAliasEdit));
    document.getElementById("host-alias-cancel-btn").addEventListener("click", () => exitHostAliasEdit(true));
    document.getElementById("drawer-host-name-input").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        runDashboardAction("home-message", submitHostAliasEdit);
      } else if (event.key === "Escape") {
        event.preventDefault();
        exitHostAliasEdit(true);
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!document.getElementById("doctor-overlay").hidden) {
        closeDoctorPanel();
        return;
      }
      if (!document.getElementById("plugin-manager-overlay").hidden) {
        closePluginManager();
        return;
      }
      const recoveryControl = document.activeElement?.closest?.(".recovery-control");
      if (recoveryControl) {
        event.preventDefault();
        recoveryControl.dataset.recoveryDismissed = "true";
        recoveryControl.focus();
        return;
      }
      if (hostAliasEditorOpen()) {
        exitHostAliasEdit(true);
        return;
      }
      closeDrawer();
    });

    renderLucideIcons();
    bindRecoveryActions();
    state.locale = detectLocale();
    applyTranslations();
    if (window.parent !== window) window.parent.postMessage({ type: "prism:locale-change", locale: state.locale }, "*");
    document.querySelectorAll("[data-locale]").forEach((option) => {
      option.addEventListener("click", () => {
        setLocale(option.dataset.locale);
        document.getElementById("locale-menu").removeAttribute("open");
      });
    });
    setTheme(loadTheme());
    startAutoRefresh();
    runDashboardAction("home-message", refreshAll);
    recoverConnectionOnStartup();
  </script>
</body>
</html>
